<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 9 — Read first, three variations</title>

<!-- The real deck stylesheets, so these are judged in the actual design
     language: same fonts, tokens, elevations, motion, and the new palette.
     Nothing here is wired into the deck. -->
<link rel="stylesheet" href="presentation-v2/assets/fonts.css">
<link rel="stylesheet" href="presentation-v2/assets/tokens.css">
<link rel="stylesheet" href="presentation-v2/assets/base.css">
<link rel="stylesheet" href="presentation-v2/core/styles.css">
<link rel="stylesheet" href="presentation-v2/assets/theme-field-guide.css">
<link rel="stylesheet" href="presentation-v2/core/slide-kit.css">

<style>
/* ══════════════ HARNESS ══════════════ */
.hb { justify-self: start; display: flex; align-items: center; gap: 10px; }
#header .header-right { display: flex; align-items: center; gap: 10px; }
#btn-replay, #btn-grey { font-size: 12.5px; padding: 5px 12px; min-height: 0; }
#stage > .proto {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: var(--ae-space-6) var(--ae-gutter);
  background: var(--fg-paper); overflow: auto;
}
body.grey #stage { filter: saturate(0); }

/* ══════════════ SHARED ══════════════
   THIS IS A TIER C SLIDE: THE EXHIBIT IS THE HERO.

   Slide 2 is the other exhibit slide in this chapter. Three diagram
   variations were built for it and all three were rejected, because on
   an exhibit slide the prompt text IS the content and a diagram competes
   with it instead of serving it. So nothing here replaces the prompt
   with a picture. What is redrawn is ATTACHMENT: today the three rules
   sit in a column beside the prompt and the reader has to work out which
   rule is about which line. In all three variations, each rule is
   physically joined to the part of the prompt it governs.

   The mapping is already in the content and was never drawn: the prompt
   has exactly three paragraphs and there are exactly three rules, in the
   same order. Name the files → line 1. Ask for a summary → the middle
   block. Forbid changes → the last line.

   COLOUR. Plan chapter, so blue is the chapter hue — it stays on the
   frame: the labels, and the wash under the annotation band. INK IS THE
   HUMAN AND THE HUMAN'S AUTHORSHIP: the human wrote this prompt, so every
   attachment mark — the numbered chips, the underline under a governed
   phrase — is ink and filled. V3 adds clay for the prompt that skips the
   step, always with a dashed edge and a "✕" so it survives greyscale.
   Two hues in the content at most, which V3 spends exactly.
   ══════════════════════════════════════════════════════════════ */
.proto .head { flex: none; }
/* "1 0 auto", not "1": the body must grow into spare space — that is what
   centres the exhibit in the frame — but it must never SHRINK below its
   content. With the default shrink factor the stacked narrow layout was
   squeezed inside a body shorter than itself, so the last rule painted
   straight through the takeaway note instead of the slide scrolling.
   "safe center" then covers the other half: when content does exceed the
   frame, centring falls back to flex-start so the top stays reachable. */
.proto .body { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: safe center; min-height: 0; }
.proto .foot { flex: none; margin-top: var(--ae-space-5); }

.proto h1 {
  margin: 0 0 var(--ae-space-2);
  font-size: var(--ae-fs-h1); line-height: var(--ae-lh-h1); color: var(--fg-ink);
}
.proto .fg-lede { margin: 0 0 var(--ae-space-5); max-width: 66ch; }

/* A label is metadata about the frame, not body text, so it is where the
   chapter hue is allowed to live. */
.lbl { color: var(--fg-plan); margin: 0 0 var(--ae-space-3); }

/* The prompt is the literal source of a message, so it takes the mono
   face — the deck's rule, unchanged. */
.src {
  margin: 0;
  font-family: var(--ae-font-mono);
  white-space: pre-wrap;
  color: var(--fg-ink);
}
/* One authored line of the prompt, with a hanging indent. The prompt's
   line breaks are the author's; a SOFT wrap is the layout's, and the two
   have to be told apart or the exhibit stops looking like a real message.
   The columns are sized so no line wraps at any stage this gets shown on,
   but the deck runs on projectors nobody measured, so if one ever does
   wrap it hangs under its own line instead of impersonating a new one. */
.src .ln { display: block; padding-left: 1.5em; text-indent: -1.5em; }

/* THE PROMPT'S SIZE IS CAPPED BY WIDTH, NOT ONLY BY HEIGHT. Every type
   token in this deck is vh-derived, and .fg-wrap is capped at 1240px — so
   on a 1920x1080 projector the mono face grew with the height while the
   column it sits in did not, and the longest German line (61 characters)
   wrapped. Measured, not guessed: it wrapped at 1920x1035 and nowhere
   else. Hence min(): the vh token, a vw term for narrow-and-tall, and an
   absolute ceiling for the case where .fg-wrap is pinned at its maximum.
   The 14px floor is the deck's, and outranks all three. */
:root { --pr-fs: max(14px, min(calc(var(--ae-fs-small) * 0.96), 1.24vw, 16.5px)); }

/* The attachment chip. Ink and filled, because the human wrote the line
   it points at, and because ink against paper is the widest contrast the
   palette has — it survives greyscale intact. */
.chip {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 26px; height: 26px; border-radius: 999px;
  background: var(--fg-ink); color: #fff;
  font-family: var(--ae-font); font-size: 14px; font-weight: 700;
  line-height: 1; font-variant-numeric: tabular-nums;
}

/* ══════════════════════════════════════════════════════════════
   V1 — THE MARGIN
   The exhibit on the left, the three rules in the margin on the
   right, each one wired to the block of the prompt it is about.
   The wire is not decoration: it is the only thing that says rule
   two belongs to the middle paragraph and not to the whole card.

   THE ROWS ARE THE ATTACHMENT. Block, chip, wire and rule are four
   items in ONE grid row, so every connector lands on its own rule
   by construction — not by a percentage that drifts the moment the
   German wraps to an extra line. The sheet is a single grid item
   spanning all three rows behind them, so the exhibit still reads
   as one continuous document rather than three stacked cards.
   ══════════════════════════════════════════════════════════════ */
/* The exhibit gets the wider half. It is sized off the LONGEST AUTHORED
   LINE — 61 mono characters, the German second block — because the moment
   that line soft-wraps the panel stops reading as a message someone sent.
   Checked at 1440x865 and at 1920x990, the two shapes this gets shown at. */
.v1 .grid {
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) clamp(36px, 4.6vw, 78px) minmax(0, 0.82fr);
  align-items: stretch;
}
.v1 .lbl-a { grid-column: 1; grid-row: 1; }
.v1 .lbl-b { grid-column: 3; grid-row: 1; }
.v1 .sheet {
  grid-column: 1; grid-row: 2 / span 3;
  background: var(--fg-card);
  border: 1px solid var(--fg-hair);
  border-radius: var(--ae-radius-lg);
  box-shadow: var(--fg-d2);
}
/* The blocks sit in the same cells as the sheet and later in the DOM, so
   they paint on top of it. Their padding is the sheet's padding.

   CENTRED, NOT STRETCHED. A row is as tall as the taller of its two
   occupants, and rows 1 and 3 are set by the RULE, not by the one line of
   prompt beside it. Left stretched, the prompt line sat at the top of its
   row and the chip sat in the middle, so the wire pointed 15px below the
   line it names. Centring both ends fixes it at any wrap. */
.v1 .blk {
  grid-column: 1; position: relative; z-index: 1;
  display: flex; align-items: center;
  padding: var(--ae-space-5);
}
.v1 .blk--2, .v1 .blk--3 { border-top: 1px solid var(--fg-hair); }
.v1 .blk .src { flex: 1; min-width: 0; font-size: var(--pr-fs); line-height: 1.85; }

/* The chip hangs half over the sheet's edge — it is ON the exhibit, not
   next to it — and the wire leaves from its far side. Negative margin,
   not absolute positioning, so it cannot drift out of its row. */
.v1 .att {
  grid-column: 2; align-self: center;
  display: flex; align-items: center; margin-left: -13px;
}
.v1 .att .wire {
  flex: 1; height: 0;
  border-top: 2px dotted var(--ae-cool-gray-400);
}
/* The vertical padding is what separates one rule from the next: with the
   rows packed to zero gap (they have to be, or the sheet behind them would
   show paper stripes) rule 1 ended a line above rule 2's heading. */
.v1 .rule {
  grid-column: 3; align-self: center;
  padding: var(--ae-space-5) 0 var(--ae-space-5) var(--ae-space-2);
}
.v1 .rule h3 {
  margin: 0; font-family: var(--ae-font-head); font-weight: 700;
  font-size: var(--ae-fs-h3); line-height: 1.12; color: var(--fg-ink);
}
.v1 .rule p {
  margin: 6px 0 0;
  font-size: var(--ae-fs-body); line-height: 1.4; color: var(--fg-body);
}

/* ══════════════════════════════════════════════════════════════
   V2 — THE MARKED-UP SHEET
   One object, not two. The prompt is given the whole frame at
   reading size, three phrases inside it are underlined in ink and
   numbered where they stand, and the three rules run underneath
   as the page's own footnote apparatus, inside the same card.

   This is the variation that spends the most frame on the exhibit
   and the least on the annotation, which is what an exhibit slide
   is supposed to do. It also attaches at PHRASE level rather than
   block level: "Summarise:" is marked, not the whole paragraph, so
   the rule points at the two words that carry it.
   ══════════════════════════════════════════════════════════════ */
.v2 .sheet {
  background: var(--fg-card);
  border: 1px solid var(--fg-hair);
  border-radius: var(--ae-radius-lg);
  box-shadow: var(--fg-d2);
  overflow: hidden;
}
.v2 .page { padding: var(--ae-space-6) var(--ae-space-7); }
.v2 .page .src {
  /* The same width guard as V1 and V3, though this panel has far more room:
     it spans the whole measure, so it only binds on a narrow-and-tall
     window. Kept anyway — the guard is cheap and the failure is silent. */
  font-size: max(15px, min(clamp(15px, 1.92vh, 25px), 2.1vw));
  /* 1.85, not 1.55: the inline chips are 22px tall and would otherwise
     push their own lines apart and leave the unmarked lines tight, so the
     paragraph would look ragged rather than set. */
  line-height: 1.85;
}
/* An ink underline, not a wash: the mark has to be a FORM cue, because
   every hue in this deck collapses to one grey. */
.v2 .mk {
  border-bottom: 2.5px solid var(--fg-ink);
  padding-bottom: 2px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.v2 .fn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--fg-ink); color: #fff;
  font-family: var(--ae-font); font-size: 14px; font-weight: 700;
  line-height: 1; font-variant-numeric: tabular-nums;
  margin-left: 6px; vertical-align: -0.28em;
}
/* The apparatus is part of the page, below a hairline, on the chapter's
   own tint — a block belonging to one hue, which is the one job the tint
   wash has. */
.v2 .apparatus {
  border-top: 1px solid var(--fg-hair);
  background: var(--fg-plan-tint);
  padding: var(--ae-space-5) var(--ae-space-7);
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  column-gap: var(--ae-space-6); row-gap: var(--ae-space-3);
}
.v2 .apparatus .lbl { grid-column: 1 / -1; margin: 0; color: var(--fg-plan-d); }
.v2 .fnote { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--ae-space-3); align-items: start; }
.v2 .fnote .chip { width: 22px; height: 22px; margin-top: 2px; }
.v2 .fnote h3 {
  margin: 0; font-family: var(--ae-font-head); font-weight: 700;
  font-size: var(--ae-fs-h4); line-height: 1.15; color: var(--fg-ink);
}
.v2 .fnote p {
  margin: 4px 0 0;
  font-size: var(--ae-fs-small); line-height: 1.4; color: var(--fg-body);
}

/* ══════════════════════════════════════════════════════════════
   V3 — WHAT WAS ADDED
   The same session one message earlier, twice: the prompt most
   people actually send, and this one. The three rules stop being
   advice and become the three things that are different — so the
   slide argues why rather than merely listing what.

   The cost: one prompt and one outcome line are NEW CONTENT, not
   in today's slide. Everything else is verbatim.
   ══════════════════════════════════════════════════════════════ */
.v3 { --v3-pr-fs: max(14px, min(calc(var(--ae-fs-small) * 0.96), 1.16vw, 15.5px)); }
.v3 .pair {
  display: grid;
  grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr);
  column-gap: var(--ae-space-6); align-items: start;
}
.v3 .before {
  border: 1.5px dashed var(--fg-fail);
  background: var(--fg-fail-tint);
  border-radius: var(--ae-radius-lg);
  padding: var(--ae-space-4) var(--ae-space-5);
}
/* The two prompts are the same kind of object, so they are set at the same
   size — a size difference would read as an argument the slide is not
   making. The after panel is the narrower text column of the two, so it
   sets the ceiling for both. */
.v3 .before .src { color: var(--fg-fail-d); font-size: var(--v3-pr-fs); line-height: 1.8; }
.v3 .out {
  display: flex; gap: var(--ae-space-2); align-items: baseline;
  margin: var(--ae-space-3) 0 0;
  font-size: var(--ae-fs-small); line-height: 1.4; color: var(--fg-fail-d);
}
.v3 .out::before { content: '\2715'; flex: none; font-weight: 700; }

.v3 .after {
  background: var(--fg-card);
  border: 1px solid var(--fg-hair);
  border-radius: var(--ae-radius-lg);
  box-shadow: var(--fg-d2);
}
.v3 .after .blk {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  column-gap: var(--ae-space-4); align-items: start;
  padding: var(--ae-space-5) var(--ae-space-5);
}
.v3 .after .blk--2, .v3 .after .blk--3 { border-top: 1px solid var(--fg-hair); }
.v3 .after .src { font-size: var(--v3-pr-fs); line-height: 1.8; }
/* Blue and filled, numbered. The number is what makes the mapping legible:
   an undifferentiated "+" on each block said three things were added but
   not WHICH of the three each one was, so the list underneath was floating
   free of the artifact again — the exact fault this redraw exists to fix.
   A chip is one of the places the chapter hue is allowed to live. */
.v3 .plus {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 26px; height: 26px; border-radius: 999px;
  background: var(--fg-plan); color: #fff;
  font-family: var(--ae-font); font-size: 14px; font-weight: 700;
  line-height: 1; font-variant-numeric: tabular-nums;
}
.v3 .adds {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  column-gap: var(--ae-space-6); row-gap: var(--ae-space-3);
  margin-top: var(--ae-space-6);
}
.v3 .adds .lbl { grid-column: 1 / -1; margin: 0; }
.v3 .add { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--ae-space-3); align-items: start; }
.v3 .add .plus { width: 22px; height: 22px; margin-top: 2px; }
.v3 .add h3 {
  margin: 0; font-family: var(--ae-font-head); font-weight: 700;
  font-size: var(--ae-fs-h4); line-height: 1.15; color: var(--fg-ink);
}
.v3 .add p { margin: 4px 0 0; font-size: var(--ae-fs-small); line-height: 1.4; color: var(--fg-body); }

/* ══════════════ narrow ══════════════
   THE BREAKPOINT IS SET BY THE PROMPT, NOT BY A ROUND NUMBER. Below about
   1180px of viewport width the longest authored line — 61 mono characters
   — no longer fits a half-width column at the deck's 14px floor, and the
   floor outranks the fit. So the two-column shapes stack at 1180px, where
   a full-width exhibit still holds every line unwrapped, rather than at
   900px with three blocks' worth of soft wraps in between.

   THE EXHIBIT SURVIVES THE STACK. An earlier version hid V1's sheet here,
   which on an exhibit slide deletes the content and keeps the commentary.
   The sheet and its blocks stay; only the wires go, and each rule keeps
   its numbered chip so the mapping to the prompt is not lost with them. */
@media (max-width: 1180px) {
  .v1 .grid { grid-template-columns: 1fr; }
  .v1 .lbl-a { grid-column: 1; grid-row: 1; }
  .v1 .sheet { grid-column: 1; grid-row: 2 / span 3; }
  .v1 .blk   { grid-column: 1; }
  /* The blocks are pinned to rows 2–4 by inline style and the sheet still
     spans them; everything else is auto-placed after row 4, in DOM order:
     chip, rule, chip, rule. Hence the !important — it is overriding an
     inline grid-row, which nothing else can. */
  .v1 .att, .v1 .rule { grid-column: 1; grid-row: auto !important; }
  .v1 .lbl-b { grid-column: 1; grid-row: 5; margin-top: var(--ae-space-5); }
  .v1 .att { margin-left: 0; align-self: end; margin-top: var(--ae-space-4); }
  .v1 .att .wire { display: none; }
  .v1 .rule { align-self: start; padding: var(--ae-space-2) 0 0; }

  .v2 .apparatus, .v3 .pair, .v3 .adds { grid-template-columns: 1fr; row-gap: var(--ae-space-4); }
  .v3 .adds { row-gap: var(--ae-space-4); }
}
</style>
</head>
<body>

<header id="header">
  <div class="header-inner" style="padding: 0 20px;">
    <div class="hb">
      <div class="lang-toggle" id="tabs" role="group" aria-label="Variation">
        <button type="button" data-p="v1">1 · Margin</button>
        <button type="button" data-p="v2">2 · Marked-up sheet</button>
        <button type="button" data-p="v3">3 · What was added</button>
      </div>
    </div>
    <span class="page-title" id="subtitle"></span>
    <span class="header-right">
      <button class="ae-btn ae-btn--secondary ae-btn--small" id="btn-grey" type="button">Greyscale</button>
      <button class="ae-btn ae-btn--secondary ae-btn--small" id="btn-replay" type="button">↻ Replay</button>
      <div class="lang-toggle" id="langs" role="group" aria-label="Language">
        <button type="button" data-l="en">EN</button>
        <button type="button" data-l="de">DE</button>
      </div>
    </span>
  </div>
</header>

<main id="stage"></main>

<script>
/* Verbatim from presentation-v2/sections/09-plan-explore.js, with the prompt
   re-expressed as its three blocks — the same six lines, split where the
   blank lines already split them, so a rule can be attached to one of them.
   MARKS names the phrase inside each block that its rule actually governs.

   New strings, V3 only: beforeLabel, before, beforeOut, addsLabel. */
const C = {
  en: {
    h1: 'Read before writing',
    lede: 'An agent that has not read your code will invent a convention for it. Reading is a few seconds. A wrong assumption is the rest of the afternoon.',
    promptLabel: 'A first prompt, before any feature is mentioned',
    rulesLabel: 'Three things that make it work',
    blocks: [
      ['Read src/api/ and the tests under tests/api/.'],
      ['Summarise: how are requests authenticated today, where is',
       'shared middleware registered, and what do the existing tests',
       'assume about request shape?'],
      ['Change nothing. I want to agree the picture before we plan.'],
    ],
    /* The trailing stop is inside mark 1 on purpose: with it outside, the
       chip landed between the file names and the full stop and the stop
       read as an orphan. */
    marks: ['src/api/ and the tests under tests/api/.', 'Summarise:', 'Change nothing.'],
    rules: [
      { t: 'Name the files', d: 'Do not rely on a search finding the right ones. If you know where it lives, say so.' },
      { t: 'Ask for a summary', d: 'A summary you disagree with is the cheapest correction available.' },
      { t: 'Forbid changes', d: 'Without it the agent will start editing. Reading and writing are separate turns.' },
    ],
    note: 'If the summary is wrong, you have found a misunderstanding for the price of one message. <b>That is the whole point of the step.</b>',
    beforeLabel: 'The usual first prompt',
    before: ['Add an endpoint for bulk user import.'],
    beforeOut: 'It has read nothing, invents a convention for your code, and starts editing.',
    addsLabel: 'The three things that were added',
  },
  de: {
    h1: 'Erst lesen, dann schreiben',
    lede: 'Ein Agent, der deinen Code nicht gelesen hat, erfindet eine Konvention dafür. Lesen kostet Sekunden. Eine falsche Annahme kostet den Rest des Nachmittags.',
    promptLabel: 'Ein erster Prompt, bevor ein Feature überhaupt erwähnt wird',
    rulesLabel: 'Drei Dinge, die es funktionieren lassen',
    blocks: [
      ['Lies src/api/ und die Tests unter tests/api/.'],
      ['Fasse zusammen: Wie werden Requests heute authentifiziert, wo',
       'wird gemeinsame Middleware registriert, und was nehmen die',
       'bestehenden Tests über die Request-Struktur an?'],
      ['Ändere nichts. Ich will das Bild klären, bevor wir planen.'],
    ],
    marks: ['src/api/ und die Tests unter tests/api/.', 'Fasse zusammen:', 'Ändere nichts.'],
    rules: [
      { t: 'Dateien benennen', d: 'Nicht darauf verlassen, dass eine Suche die richtigen findet. Wenn du den Ort kennst, nenn ihn.' },
      { t: 'Zusammenfassung verlangen', d: 'Eine Zusammenfassung, der du widersprichst, ist die billigste Korrektur, die es gibt.' },
      { t: 'Änderungen verbieten', d: 'Ohne das fängt der Agent an zu editieren. Lesen und Schreiben sind getrennte Züge.' },
    ],
    note: 'Ist die Zusammenfassung falsch, hast du ein Missverständnis für den Preis einer Nachricht gefunden. <b>Genau dafür ist der Schritt da.</b>',
    beforeLabel: 'Der übliche erste Prompt',
    before: ['Bau einen Endpoint für Bulk-User-Import.'],
    beforeOut: 'Er hat nichts gelesen, erfindet eine Konvention für deinen Code und fängt an zu editieren.',
    addsLabel: 'Die drei Dinge, die dazugekommen sind',
  },
};

const SUB = {
  v1: 'Variation 1 — the margin: each rule wired to the block of the prompt it governs',
  v2: 'Variation 2 — the marked-up sheet: phrases underlined in place, rules as the page’s footnotes',
  v3: 'Variation 3 — what was added: the usual first prompt, and the three things that are missing from it',
};

/* Underline the governed phrase where it stands and drop a numbered chip
   after it. The phrase is a literal substring of the block, so the marker
   cannot land anywhere the rule is not about. */
function markUp(t, i) {
  const s = t.blocks[i].join('\n');
  const m = t.marks[i];
  return s.replace(m, '<span class="mk">' + m + '</span><span class="fn">' + (i + 1) + '</span>');
}

/* One <span class="ln"> per authored line, so a soft wrap can hang under
   its own line rather than looking like a line the author wrote. */
function lines(b) {
  return b.map(function (l) { return '<span class="ln">' + (l || '&nbsp;') + '</span>'; }).join('');
}

/* ── V1 ── */
function V1(t) {
  let h = '<div class="grid">'
    + '<p class="fg-label lbl lbl-a fg-in" style="--fg-at:3">' + t.promptLabel + '</p>'
    + '<p class="fg-label lbl lbl-b fg-in" style="--fg-at:3">' + t.rulesLabel + '</p>'
    + '<div class="sheet fg-in" style="--fg-at:3"></div>';
  t.blocks.forEach(function (b, i) {
    const row = 'grid-row:' + (2 + i) + ';';
    h += '<div class="blk blk--' + (i + 1) + ' fg-in" style="' + row + ' --fg-at:' + (4 + i * 2) + '">'
       +   '<p class="src">' + lines(b) + '</p>'
       + '</div>'
       + '<div class="att fg-in" aria-hidden="true" style="' + row + ' --fg-at:' + (5 + i * 2) + '">'
       +   '<span class="chip">' + (i + 1) + '</span><i class="wire"></i>'
       + '</div>'
       + '<div class="rule fg-in" style="' + row + ' --fg-at:' + (5 + i * 2) + '">'
       +   '<h3>' + t.rules[i].t + '</h3><p>' + t.rules[i].d + '</p>'
       + '</div>';
  });
  return h + '</div>';
}

/* ── V2 ── */
function V2(t) {
  const page = t.blocks.map(function (b, i) { return markUp(t, i); }).join('\n\n');
  let h = '<p class="fg-label lbl fg-in" style="--fg-at:3">' + t.promptLabel + '</p>'
    + '<div class="sheet fg-in" style="--fg-at:3">'
    +   '<div class="page"><p class="src">' + page + '</p></div>'
    +   '<div class="apparatus">'
    +     '<p class="fg-label lbl fg-in" style="--fg-at:6">' + t.rulesLabel + '</p>';
  t.rules.forEach(function (r, i) {
    h += '<div class="fnote fg-in" style="--fg-at:' + (7 + i) + '">'
       +   '<span class="chip">' + (i + 1) + '</span>'
       +   '<div><h3>' + r.t + '</h3><p>' + r.d + '</p></div>'
       + '</div>';
  });
  return h + '</div></div>';
}

/* ── V3 ── */
function V3(t) {
  let after = '<div class="after fg-in" style="--fg-at:4">';
  t.blocks.forEach(function (b, i) {
    after += '<div class="blk blk--' + (i + 1) + ' fg-in" style="--fg-at:' + (5 + i) + '">'
          +    '<span class="plus">' + (i + 1) + '</span>'
          +    '<p class="src">' + lines(b) + '</p>'
          +  '</div>';
  });
  after += '</div>';

  let adds = '<div class="adds">'
    + '<p class="fg-label lbl fg-in" style="--fg-at:8">' + t.addsLabel + '</p>';
  t.rules.forEach(function (r, i) {
    adds += '<div class="add fg-in" style="--fg-at:' + (9 + i) + '">'
         +    '<span class="plus">' + (i + 1) + '</span>'
         +    '<div><h3>' + r.t + '</h3><p>' + r.d + '</p></div>'
         +  '</div>';
  });
  adds += '</div>';

  return '<div class="pair">'
    +   '<div class="col">'
    +     '<p class="fg-label lbl fg-in" style="--fg-at:3">' + t.beforeLabel + '</p>'
    +     '<div class="before fg-in" style="--fg-at:3"><p class="src">' + lines(t.before) + '</p></div>'
    +     '<p class="out fg-in" style="--fg-at:4">' + t.beforeOut + '</p>'
    +   '</div>'
    +   '<div class="col">'
    +     '<p class="fg-label lbl fg-in" style="--fg-at:4">' + t.promptLabel + '</p>'
    +     after
    +   '</div>'
    + '</div>'
    + adds;
}

const BODY = { v1: V1, v2: V2, v3: V3 };

function render(v, t) {
  return ''
  + '<section class="proto ' + v + '">'
    + '<div class="fg-wrap head">'
      + '<h1 class="fg-in" style="--fg-at:1">' + t.h1 + '</h1>'
      + '<p class="fg-lede fg-in" style="--fg-at:2">' + t.lede + '</p>'
    + '</div>'
    + '<div class="fg-wrap body">' + BODY[v](t) + '</div>'
    + '<div class="fg-wrap foot"><p class="fg-note fg-in" style="--fg-at:12"><span>' + t.note + '</span></p></div>'
  + '</section>';
}

let lang = 'en', proto = 'v1';
const stage = document.getElementById('stage');
function mount() {
  document.getElementById('subtitle').textContent = SUB[proto];
  stage.innerHTML = render(proto, C[lang]);
  const sync = (sel, key, val) => document.querySelectorAll(sel + ' button')
    .forEach(b => b.classList.toggle('active', b.dataset[key] === String(val)));
  sync('#tabs', 'p', proto); sync('#langs', 'l', lang);
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; proto = b.dataset.p; mount(); });
document.getElementById('langs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; mount(); });
document.getElementById('btn-replay').addEventListener('click', mount);
document.getElementById('btn-grey').addEventListener('click', () => document.body.classList.toggle('grey'));
document.addEventListener('keydown', e => { if (['1','2','3'].includes(e.key)) { proto = 'v' + e.key; mount(); } });
mount();
</script>
</body>
</html>
