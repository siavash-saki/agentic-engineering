<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 23 — Four things the author cannot see, three variations</title>

<link rel="stylesheet" href="presentation-v2/assets/fonts.css">
<link rel="stylesheet" href="presentation-v2/assets/tokens.css">
<link rel="stylesheet" href="presentation-v2/assets/base.css">
<link rel="stylesheet" href="presentation-v2/core/styles.css">
<link rel="stylesheet" href="presentation-v2/assets/theme-field-guide.css">
<link rel="stylesheet" href="presentation-v2/core/slide-kit.css">

<style>
/* ══════════════ HARNESS ══════════════ */
.hb { justify-self: start; display: flex; align-items: center; gap: 10px; }
#header .header-right { display: flex; align-items: center; gap: 10px; }
#btn-replay, #btn-grey { font-size: 12.5px; padding: 5px 12px; min-height: 0; }
#stage > .proto {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: var(--ae-space-6) var(--ae-gutter);
  background: var(--fg-paper); overflow: auto;
}
body.grey #stage { filter: saturate(0); }

/* ══════════════ SHARED ══════════════
   DESIGN.md: "set of four + two", verdict "light — densest slide (215
   words), split candidate". Density is the whole problem, and it may
   not be solved by deleting prose: the deck is also a thing a reader
   clicks through alone.

   THE 4 AND THE 2 ARE NOT PEERS, WHICH IS WHY THE SLIDE READS AS A
   WALL. The four are classes of defect a second model finds — they
   belong to the machine, and their point is that they are NAMED, so
   they can be asked for. The two are what the human does with that
   pass: read the diff anyway, and treat what comes back as input. The
   current layout draws both as "items with descriptions", so the
   viewer has to work out which kind of thing they are looking at.
   Every variation here draws that seam instead of describing it.

   COLOUR. Plum is the chapter — it stays on the frame: the enclosure
   edge (V1), the second-model node (V2), the eyebrow (V3a/V3b). Clay
   is the state colour and it is spent on the four, because each one
   is a defect that shipped silently; it always travels with a ✕ and,
   where the layout allows it, a dashed rule. Ink is the human and
   nothing else: the two rules carry a solid rule and a filled ink
   mark. Two hues in the content, plus ink and greys.

   Strip the colour and the distinction survives on form alone:
   ✕ vs a filled square/disc, dashed vs solid, inside the box vs on
   the paper. Test it with the Greyscale button.

   FIT. The deck's real stage is ~110px shorter than this harness's
   (header + nav bar). All numbers reported for these variations are
   measured against the REAL stage height, not this one. */
.proto .head { flex: none; }
.proto .body { flex: 1; display: flex; flex-direction: column; justify-content: safe center; min-height: 0; }
.proto .foot { flex: none; margin-top: var(--ae-space-4); }

.proto h1 {
  margin: 0 0 var(--ae-space-3);
  font-size: var(--ae-fs-h2); line-height: var(--ae-lh-h2); color: var(--fg-ink);
}
.proto .fg-lede { margin: 0; max-width: 78ch; }

/* ── the eyebrow. Chapter hue on a piece of metadata, never on prose. ── */
.eyebrow {
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: var(--ae-lh-caption);
  font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg-review); margin: 0;
}

/* ── the two marks, shared by every variation ──
      A class of defect: clay ✕. A human rule: a filled ink square.
      Both are shapes first and colours second. ── */
.x { flex: none; font-style: normal; font-weight: 700; color: var(--fg-fail); }
.sq {
  flex: none; width: 13px; height: 13px; border-radius: 3px;
  background: var(--fg-ink); margin-top: 0.42em;
}

/* ══════════════════════════════════════════════════════════════
   V1 — THE CATALOGUE
   The four sit inside one drawn enclosure with a labelled edge,
   because their whole value is that they are a named set you can
   hand to a second model. The two rules are outside it, on the
   paper, under a solid ink rule: they are not things the model
   finds, they are things you do. One picture, one seam, no new
   slide.
   ══════════════════════════════════════════════════════════════ */
.v1 .cat {
  position: relative;
  border: 1.5px solid var(--fg-review);
  border-radius: var(--ae-radius-lg);
  background: var(--fg-card);
  box-shadow: var(--fg-d1);
  padding: var(--ae-space-6) var(--ae-space-6) var(--ae-space-5);
}
.v1 .cat__lab {
  position: absolute; top: 0; left: var(--ae-space-6);
  transform: translateY(-50%);
  padding: 0 10px; background: var(--fg-paper);
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: var(--ae-lh-caption);
  font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg-review); white-space: nowrap;
}
.v1 .four {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: var(--ae-space-5);
}
.v1 .cls { border-top: 2px dashed var(--fg-fail); padding-top: var(--ae-space-3); }
.v1 .cls h3 {
  display: flex; gap: 8px; align-items: baseline;
  margin: 0 0 var(--ae-space-2);
  font-size: var(--ae-fs-h4); line-height: 1.2; color: var(--fg-ink);
}
.v1 .cls p {
  margin: 0; font-size: var(--ae-fs-body); line-height: 1.42; color: var(--fg-body);
}

.v1 .rules { margin-top: var(--ae-space-6); }
.v1 .rules__lab { margin: 0 0 var(--ae-space-3); color: var(--fg-ink); }
.v1 .rules__items {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--ae-space-8);
}
/* Solid, and heavier than the dashed clay above: the human's rule is
   the hardest mark the palette has, and it is the same device slide 6
   uses for the line you choose. */
.v1 .rl { border-top: 2.5px solid var(--fg-ink); padding-top: var(--ae-space-3); }
.v1 .rl h3 {
  display: flex; gap: 10px; align-items: flex-start;
  margin: 0 0 4px;
  font-size: var(--ae-fs-h3); line-height: 1.18; color: var(--fg-ink);
}
.v1 .rl p {
  margin: 0; font-size: var(--ae-fs-body); line-height: 1.42; color: var(--fg-body);
}

/* ══════════════════════════════════════════════════════════════
   V2 — THE PASS
   The same content drawn as what actually happens: you hand over
   the diff, a second model reads it, the findings come back to
   you. Both ends of the line are ink, because both rules are about
   what the HUMAN does — and that is precisely why they were never
   peers of the four. The four hang off the middle station, which
   is the only station that finds anything.

   CSS-BORDER GEOMETRY, NOT SVG. Rails, arrowheads and the fan stem
   are borders: a stretched viewBox turns an arrowhead into a smear.
   ══════════════════════════════════════════════════════════════ */
/* THE RAIL IS BOUNDED BY THE TWO INK MARKS, NOT BY THE FRAME. The three
   marker columns are auto — each is exactly as wide as its mark — and the
   outer two are pushed to the grid's edges. The rail then spans 1 / -1 and
   its ends disappear under the ink squares by construction, so it can never
   overhang the way a percentage inset drifts when German rewraps. The two
   arrowheads sit at the far end of the wire columns, which is the same line
   as the next station's edge. */
.v2 .pass {
  --mk: clamp(38px, 5vh, 54px);      /* the ink square: the marker ruler */
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr) auto;
  align-items: start;
}
/* row 1 wire labels · row 2 marks + rail · row 3 captions · row 4 prose
   · row 5 the drop to the fan */
.v2 .wl {
  grid-row: 1; align-self: end; text-align: center;
  padding-bottom: 6px;
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: var(--ae-lh-caption); color: var(--fg-faint);
}
.v2 .rail {
  grid-row: 2; grid-column: 1 / -1; align-self: center;
  height: 2px; background: var(--ae-cool-gray-300); z-index: 0;
  transform-origin: left center;
  animation: v2rail 760ms var(--ae-ease) both;
  animation-delay: calc(60ms + 3 * var(--fg-beat));
}
@keyframes v2rail { from { transform: scaleX(0); } }
.v2 .head-r {
  grid-row: 2; align-self: center; justify-self: end;
  width: 0; height: 0; z-index: 2;
  border-left: 11px solid var(--ae-cool-gray-300);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
}
.v2 .mkcell { grid-row: 2; align-self: center; z-index: 3; }
.v2 .mkcell--l { grid-column: 1; justify-self: start; }
.v2 .mkcell--m { grid-column: 3; justify-self: center; }
.v2 .mkcell--r { grid-column: 5; justify-self: end; }
.v2 .mk--you {
  display: block;
  width: var(--mk); height: var(--mk); border-radius: 8px;
  background: var(--fg-ink); box-shadow: var(--fg-d2);
}
/* The second model: hollow and hued, the cast's machine form. A ring,
   not a disc — the filled mark is reserved for the human. */
.v2 .mk--reader {
  display: block;
  width: calc(var(--mk) * 1.5); height: calc(var(--mk) * 1.5);
  border-radius: 999px;
  background: var(--fg-card); border: 5px solid var(--fg-review);
  box-shadow: var(--fg-d1);
}
.v2 .cap {
  grid-row: 3; padding-top: var(--ae-space-3);
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: var(--ae-lh-caption); font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
}
.v2 .cap--you { color: var(--fg-ink); }
/* Zero width on purpose: a caption wide enough to name the station would
   otherwise widen its auto column, and the ring would stop touching the
   arrowheads. A zero-width FLEX box centres its child on the ring and lets
   it overflow into the empty wire columns either side — text-align alone
   does not do this, it left-aligns against the zero-width line box. */
.v2 .cap--reader {
  grid-column: 3; justify-self: center; width: 0;
  display: flex; justify-content: center; color: var(--fg-review);
}
.v2 .cap--reader b { font-weight: 700; }
.v2 .rl { grid-row: 4; padding-top: var(--ae-space-4); }
.v2 .rl--l { grid-column: 1 / 3; }
.v2 .rl--r { grid-column: 4 / 6; text-align: right; }
.v2 .rl h3 {
  margin: 0 0 4px; font-size: var(--ae-fs-h4); line-height: 1.2; color: var(--fg-ink);
}
.v2 .rl p {
  margin: 0; max-width: 40ch;
  font-size: var(--ae-fs-small); line-height: 1.45; color: var(--fg-body);
}
.v2 .rl--r p { margin-left: auto; }

/* The stem: the four come OUT of the middle station. It runs from under
   the reader's caption to the fan bar in one piece — the drop lives in a
   grid row of its own rather than as a margin on the fan, because a margin
   would end the line short of the thing it connects to. */
.v2 .drop { grid-row: 5; grid-column: 1; height: var(--ae-space-6); }
.v2 .stem {
  grid-row: 4 / 6; grid-column: 3; justify-self: center; align-self: stretch;
  width: 0; border-left: 2px dotted var(--ae-cool-gray-400);
}
.v2 .fan { margin-top: 0; border-top: 1.5px solid var(--fg-review); }
.v2 .fan__lab { margin: var(--ae-space-3) 0 var(--ae-space-4); }
.v2 .four {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: var(--ae-space-5);
}
.v2 .cls h3 {
  display: flex; gap: 8px; align-items: baseline;
  margin: 0 0 var(--ae-space-2);
  font-size: var(--ae-fs-h5); line-height: 1.22; color: var(--fg-ink);
}
.v2 .cls p {
  margin: 0; font-size: var(--ae-fs-small); line-height: 1.45; color: var(--fg-body);
}

/* ══════════════════════════════════════════════════════════════
   V3a — THE SPLIT, PAGE ONE
   The four alone, given a whole frame: two rows of two, at body
   size instead of caption size. This is the page that answers
   "what does the second reader look for" and nothing else.
   ══════════════════════════════════════════════════════════════ */
/* Page one is given the whole frame, so it spends it on the two things
   four narrow columns cannot buy: headings at h2 instead of h5, and a
   prose measure of ~55 characters instead of ~34. */
.v3a h1 { font-size: var(--ae-fs-h1); line-height: var(--ae-lh-h1); }
.v3a .four {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--ae-space-8); row-gap: var(--ae-space-6);
}
.v3a .cls { border-top: 2px dashed var(--fg-fail); padding-top: var(--ae-space-4); }
.v3a .cls h3 {
  display: flex; gap: 10px; align-items: baseline;
  margin: 0 0 var(--ae-space-2);
  font-size: var(--ae-fs-h2); line-height: 1.14; color: var(--fg-ink);
}
.v3a .cls p {
  margin: 0; font-size: var(--ae-fs-lead); line-height: 1.4; color: var(--fg-body);
}
.v3a .eyebrow { margin-bottom: var(--ae-space-4); }

/* ══════════════════════════════════════════════════════════════
   V3b — THE SPLIT, PAGE TWO
   The human's page, and the Review chapter's only Tier A slide.
   Everything on it is ink, because everything on it is something
   a person does. Two rules, at a size that says they are the
   claim rather than a footnote under the four.
   ══════════════════════════════════════════════════════════════ */
.v3b h1 {
  margin: var(--ae-space-3) 0 0;
  font-family: var(--ae-font-head); font-weight: 700;
  font-size: var(--ae-fs-display); line-height: 1.02;
  letter-spacing: -0.035em; color: var(--fg-ink);
}
.v3b .rules { display: grid; row-gap: var(--ae-space-9); }
.v3b .rl {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  column-gap: var(--ae-space-5); align-items: start;
  border-top: 2.5px solid var(--fg-ink); padding-top: var(--ae-space-5);
}
.v3b .rl .disc {
  flex: none; width: clamp(34px, 4.8vh, 54px); height: clamp(34px, 4.8vh, 54px);
  border-radius: 999px; background: var(--fg-ink); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ae-font); font-size: var(--ae-fs-caption); font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.v3b .rl h3 {
  margin: 0; font-size: var(--ae-fs-h1); line-height: 1.05;
  letter-spacing: -0.03em; color: var(--fg-ink);
}
/* A page carrying 65 words sets them at statement size or it is not a
   statement page — at lede size the two rules read as a caption under an
   empty frame. */
.v3b .rl p {
  margin: var(--ae-space-4) 0 0; max-width: 38ch;
  font-size: var(--ae-fs-h2); line-height: 1.35; color: var(--fg-body);
}

/* The local keyframe is the only motion the slide kit's print guard does
   not already strip; the base style is the finished rail. */
@media print { .v2 .rail { animation: none !important; } }

@media (max-width: 1000px) {
  .v1 .four, .v2 .four { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: var(--ae-space-5); }
  .v3a .four { grid-template-columns: 1fr; }
  .v1 .rules__items { grid-template-columns: 1fr; row-gap: var(--ae-space-5); }
  .v2 .pass { grid-template-columns: 1fr; row-gap: var(--ae-space-4); }
  .v2 .rail, .v2 .head-r, .v2 .stem, .v2 .wl { display: none; }
  .v2 .mkcell, .v2 .cap, .v2 .rl { grid-row: auto; grid-column: 1; }
}
</style>
</head>
<body>

<header id="header">
  <div class="header-inner" style="padding: 0 20px;">
    <div class="hb">
      <div class="lang-toggle" id="tabs" role="group" aria-label="Variation">
        <button type="button" data-p="v1">1 · Catalogue</button>
        <button type="button" data-p="v2">2 · Pass</button>
        <button type="button" data-p="v3a">3a · Split ①</button>
        <button type="button" data-p="v3b">3b · Split ②</button>
      </div>
    </div>
    <span class="page-title" id="subtitle"></span>
    <span class="header-right">
      <button class="ae-btn ae-btn--secondary ae-btn--small" id="btn-grey" type="button">Greyscale</button>
      <button class="ae-btn ae-btn--secondary ae-btn--small" id="btn-replay" type="button">↻ Replay</button>
      <div class="lang-toggle" id="langs" role="group" aria-label="Language">
        <button type="button" data-l="en">EN</button>
        <button type="button" data-l="de">DE</button>
      </div>
    </span>
  </div>
</header>

<main id="stage"></main>

<script>
/* Every sentence of the four classes and the two rules is verbatim from
   presentation-v2/sections/23-review-diff.js. The lede is split into its
   two existing sentences so a variation can place them separately; no
   word of it is dropped.

   NEW STRINGS, all in both languages:
     ask     the enclosure label. The slide's own header comment says the
             four are "named so they can be asked for by name" — that is
             the reason the set exists and it was never on the slide.
     you     the ink station label in V2.
     reader  the plum station label in V2.
     w1 / w2 what travels along the line in V2.
     h1b     the title page two would carry if the slide is split. */
const C = {
  en: {
    h1: 'Four things the author cannot see',
    ledeA: 'A second model reading the diff is cheap and takes minutes.',
    ledeB: 'These are the classes it finds that the writing model does not, because checking them means doubting your own work.',
    ask: 'Ask for these by name',
    you: 'you',
    reader: 'a second model',
    w1: 'the diff',
    w2: 'findings',
    classes: [
      { t: 'A check that cannot fail',
        d: 'Both sides of a comparison from the same source. An absence asserted against a payload that never held the value. Anything called a regression test with no named defect it was seen to catch.' },
      { t: 'A claim the evidence does not support',
        d: 'A criterion marked done in terms its own evidence does not entail. Look hardest at criteria with an "and" in them.' },
      { t: 'A citation that resolves to nothing',
        d: 'A referenced file, test, commit or command that does not exist. Agents cite fluently and are not embarrassed by a dead path.' },
      { t: 'A defect in the measurement',
        d: 'The benchmark, the harness, the counting window. A harness is code too, and a wrong number is presented with exactly the same confidence as a right one.' },
    ],
    practiceLabel: 'And two rules around it',
    practice: [
      { t: 'Read the diff yourself',
        d: 'Every one, including your own agent\'s. Especially your own agent\'s — that is the one you are inclined to skim.' },
      { t: 'Findings are input, not orders',
        d: 'Adopt what stands up, decline the rest and say why. Cap it at two rounds, then decide.' },
    ],
    h1b: 'You read the diff, and you decide',
  },
  de: {
    h1: 'Vier Dinge, die der Autor nicht sehen kann',
    ledeA: 'Ein zweites Modell, das den Diff liest, kostet wenig und dauert Minuten.',
    ledeB: 'Das sind die Klassen, die es findet und das schreibende Modell nicht — weil ihre Prüfung bedeutet, an der eigenen Arbeit zu zweifeln.',
    ask: 'Danach namentlich fragen',
    you: 'du',
    reader: 'ein zweites Modell',
    w1: 'der Diff',
    w2: 'Befunde',
    classes: [
      { t: 'Eine Prüfung, die nicht scheitern kann',
        d: 'Beide Seiten eines Vergleichs aus derselben Quelle. Eine Abwesenheit geprüft an einer Antwort, die den Wert nie enthielt. Alles, was Regressionstest heißt, ohne benannten Defekt, an dem es rot wurde.' },
      { t: 'Eine Aussage, die ihr Beleg nicht trägt',
        d: 'Ein Kriterium als erledigt markiert in Worten, die sein eigener Beleg nicht hergibt. Am genauesten dort hinsehen, wo ein „und" im Kriterium steht.' },
      { t: 'Ein Verweis, der ins Leere geht',
        d: 'Eine referenzierte Datei, ein Test, ein Commit, ein Kommando, das es nicht gibt. Agenten zitieren flüssig und stören sich nicht an einem toten Pfad.' },
      { t: 'Ein Defekt in der Messung',
        d: 'Der Benchmark, das Harness, das Zählfenster. Ein Harness ist auch Code, und eine falsche Zahl wird mit genau derselben Sicherheit präsentiert wie eine richtige.' },
    ],
    practiceLabel: 'Und zwei Regeln drumherum',
    practice: [
      { t: 'Den Diff selbst lesen',
        d: 'Jeden, auch den des eigenen Agenten. Gerade den des eigenen Agenten — das ist der, den man überfliegt.' },
      { t: 'Befunde sind Input, keine Befehle',
        d: 'Übernehmen, was standhält, den Rest begründet ablehnen. Nach zwei Runden entscheiden.' },
    ],
    h1b: 'Du liest den Diff, und du entscheidest',
  },
};

const SUB = {
  v1:  'Variation 1 — the catalogue: the four inside one named enclosure, the two rules outside it in ink',
  v2:  'Variation 2 — the pass: you, a second model, you — and the four hang off the only station that finds anything',
  v3a: 'Split, page one — the four alone, at reading size in a whole frame',
  v3b: 'Split, page two — the human\'s page: two rules, Tier A, all ink',
};

function classHTML(c, at) {
  return '<div class="cls fg-in" style="--fg-at:' + at + '">'
    + '<h3><i class="x">✕</i><span>' + c.t + '</span></h3>'
    + '<p>' + c.d + '</p>'
  + '</div>';
}

/* ── V1 · the catalogue ── */
function V1(t) {
  return ''
  + '<div class="fg-wrap head">'
    + '<h1 class="fg-in" style="--fg-at:1">' + t.h1 + '</h1>'
    + '<p class="fg-lede fg-in" style="--fg-at:2">' + t.ledeA + ' ' + t.ledeB + '</p>'
  + '</div>'
  + '<div class="fg-wrap body">'
    + '<div class="cat fg-in" style="--fg-at:3">'
      + '<span class="cat__lab">' + t.ask + '</span>'
      + '<div class="four">'
        + t.classes.map(function (c, i) { return classHTML(c, 4 + i); }).join('')
      + '</div>'
    + '</div>'
    + '<div class="rules">'
      + '<p class="eyebrow rules__lab fg-in" style="--fg-at:8; color: var(--fg-muted)">' + t.practiceLabel + '</p>'
      + '<div class="rules__items">'
        + t.practice.map(function (p, i) {
            return '<div class="rl fg-in" style="--fg-at:' + (9 + i) + '">'
              + '<h3><i class="sq"></i><span>' + p.t + '</span></h3>'
              + '<p>' + p.d + '</p>'
            + '</div>';
          }).join('')
      + '</div>'
    + '</div>'
  + '</div>';
}

/* ── V2 · the pass ── */
function V2(t) {
  return ''
  + '<div class="fg-wrap head">'
    + '<h1 class="fg-in" style="--fg-at:1">' + t.h1 + '</h1>'
    + '<p class="fg-lede fg-in" style="--fg-at:2">' + t.ledeA + '</p>'
  + '</div>'
  + '<div class="fg-wrap body">'
    + '<div class="pass">'
      + '<i class="rail" aria-hidden="true"></i>'
      + '<span class="wl fg-in" style="grid-column:2; --fg-at:4">' + t.w1 + '</span>'
      + '<span class="wl fg-in" style="grid-column:4; --fg-at:6">' + t.w2 + '</span>'
      + '<i class="head-r fg-in" aria-hidden="true" style="grid-column:2; --fg-at:4"></i>'
      + '<i class="head-r fg-in" aria-hidden="true" style="grid-column:4; --fg-at:6"></i>'

      + '<div class="mkcell mkcell--l fg-in" style="--fg-at:3"><i class="mk--you"></i></div>'
      + '<span class="cap cap--you fg-in" style="grid-column:1; justify-self:start; --fg-at:3">' + t.you + '</span>'
      + '<div class="rl rl--l fg-in" style="--fg-at:3">'
        + '<h3>' + t.practice[0].t + '</h3><p>' + t.practice[0].d + '</p>'
      + '</div>'

      + '<div class="mkcell mkcell--m fg-in" style="--fg-at:5"><i class="mk--reader"></i></div>'
      + '<span class="cap cap--reader fg-in" style="--fg-at:5"><b>' + t.reader + '</b></span>'

      + '<div class="mkcell mkcell--r fg-in" style="--fg-at:7"><i class="mk--you"></i></div>'
      + '<span class="cap cap--you fg-in" style="grid-column:5; justify-self:end; --fg-at:7">' + t.you + '</span>'
      + '<div class="rl rl--r fg-in" style="--fg-at:7">'
        + '<h3>' + t.practice[1].t + '</h3><p>' + t.practice[1].d + '</p>'
      + '</div>'

      + '<i class="drop" aria-hidden="true"></i>'
      + '<i class="stem fg-in" aria-hidden="true" style="--fg-at:8"></i>'
    + '</div>'
    + '<div class="fan fg-in" style="--fg-at:8">'
      + '<p class="fg-lede fan__lab" style="font-size: var(--ae-fs-body); line-height: 1.42">' + t.ledeB + '</p>'
      + '<div class="four">'
        + t.classes.map(function (c, i) { return classHTML(c, 9 + i); }).join('')
      + '</div>'
    + '</div>'
  + '</div>';
}

/* ── V3a · split, page one ── */
function V3a(t) {
  return ''
  + '<div class="fg-wrap head">'
    + '<h1 class="fg-in" style="--fg-at:1">' + t.h1 + '</h1>'
    + '<p class="fg-lede fg-in" style="--fg-at:2">' + t.ledeA + ' ' + t.ledeB + '</p>'
  + '</div>'
  + '<div class="fg-wrap body">'
    + '<p class="eyebrow fg-in" style="--fg-at:3">' + t.ask + '</p>'
    + '<div class="four">'
      + t.classes.map(function (c, i) { return classHTML(c, 4 + i); }).join('')
    + '</div>'
  + '</div>';
}

/* ── V3b · split, page two ── */
function V3b(t) {
  return ''
  + '<div class="fg-wrap head">'
    + '<p class="eyebrow fg-in" style="--fg-at:1">' + t.practiceLabel + '</p>'
    + '<h1 class="fg-in" style="--fg-at:1">' + t.h1b + '</h1>'
  + '</div>'
  + '<div class="fg-wrap body">'
    + '<div class="rules">'
      + t.practice.map(function (p, i) {
          return '<div class="rl fg-in" style="--fg-at:' + (3 + i * 2) + '">'
            + '<span class="disc">' + (i + 1) + '</span>'
            + '<div><h3>' + p.t + '</h3><p>' + p.d + '</p></div>'
          + '</div>';
        }).join('')
    + '</div>'
  + '</div>';
}

const BODY = { v1: V1, v2: V2, v3a: V3a, v3b: V3b };

function render(v, t) {
  return '<section class="proto ' + v + '">' + BODY[v](t) + '</section>';
}

let lang = 'en', proto = 'v1';
const stage = document.getElementById('stage');
function mount() {
  document.getElementById('subtitle').textContent = SUB[proto];
  stage.innerHTML = render(proto, C[lang]);
  const sync = (sel, key, val) => document.querySelectorAll(sel + ' button')
    .forEach(b => b.classList.toggle('active', b.dataset[key] === String(val)));
  sync('#tabs', 'p', proto); sync('#langs', 'l', lang);
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; proto = b.dataset.p; mount(); });
document.getElementById('langs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; mount(); });
document.getElementById('btn-replay').addEventListener('click', mount);
document.getElementById('btn-grey').addEventListener('click', () => document.body.classList.toggle('grey'));
document.addEventListener('keydown', e => {
  const map = { '1': 'v1', '2': 'v2', '3': 'v3a', '4': 'v3b' };
  if (map[e.key]) { proto = map[e.key]; mount(); }
});
mount();
</script>
</body>
</html>
