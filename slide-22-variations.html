<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 22 — Who reviews, three variations</title>

<!-- The real deck stylesheets, so these are judged in the actual design
     language: same fonts, tokens, elevations, motion, palette. Nothing
     here is wired into the deck. -->
<link rel="stylesheet" href="presentation-v2/assets/fonts.css">
<link rel="stylesheet" href="presentation-v2/assets/tokens.css">
<link rel="stylesheet" href="presentation-v2/assets/base.css">
<link rel="stylesheet" href="presentation-v2/core/styles.css">
<link rel="stylesheet" href="presentation-v2/assets/theme-field-guide.css">
<link rel="stylesheet" href="presentation-v2/core/slide-kit.css">

<style>
/* ══════════════ HARNESS ══════════════ */
.hb { justify-self: start; display: flex; align-items: center; gap: 10px; }
#header .header-right { display: flex; align-items: center; gap: 10px; }
#btn-replay, #btn-grey { font-size: 12.5px; padding: 5px 12px; min-height: 0; }
#stage > .proto {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: var(--ae-space-6) var(--ae-gutter);
  background: var(--fg-paper); overflow: auto;
}
body.grey #stage { filter: saturate(0); }

/* ══════════════ SHARED ══════════════
   THE DEFECT THIS SLIDE HAS. DESIGN.md calls the idea a LADDER — ordered
   and monotonic — and the slide renders it as four table rows. Four rows
   are four peers. The slide's whole claim is that they are not peers:
   independence increases from rung 1 to rung 4, and rung 4 is the end of
   the line. Today rung 4 looks exactly like rung 1 with different words
   in it.

   So every variation here is built on the same two commitments.

   1. THE GEOMETRY CARRIES THE ORDER. Height, distance or enclosure — the
      drawing has to fail to be readable as four equals. That also means
      no variation may rest the distinction on hue: a bar that is taller,
      a marker that is further along the track, a rung that sits outside
      the box, all survive the Greyscale button.

   2. THE GAPS ARE NOT EQUAL. Rungs 1 and 2 are the same model reading
      its own output twice; the deck's own note says so. Drawn evenly
      they would contradict the note under them. So 1 and 2 sit close and
      the jump to 3 is the tall one — that is where the failure modes
      change, and it is the only step that changes what CAN be found.

   INK IS THE HUMAN. Plum is the Review chapter and it is on the three
   machine rungs; rung 4 is ink, filled, and it is the strongest mark on
   the slide. That contrast — a hard black stop above three soft coloured
   ones — is what makes the top of the ladder look like the top, and it
   is the deck's own rule rather than a local flourish (DESIGN.md pass 4).
   Two hues in the content: plum and the mint of the shared note device.  */

.proto .head { flex: none; }
.proto .body { flex: 1; display: flex; flex-direction: column; justify-content: safe center; min-height: 0; }
.proto .foot { flex: none; margin-top: var(--ae-space-4); }

.proto h1 {
  margin: 0 0 var(--ae-space-2);
  font-size: var(--ae-fs-h2); line-height: var(--ae-lh-h2); color: var(--fg-ink);
}
.proto .fg-lede { margin: 0; max-width: 74ch; }

/* ── the axis label, used by V1 and V3 ──
   Written along the arrow rather than above it, because the arrow is the
   claim and the words are the caption. writing-mode + rotate, not SVG: a
   stretched viewBox smears an arrowhead and this one has to stay sharp. */
.axis { display: flex; flex-direction: column; align-items: center; gap: var(--ae-space-2); }
.axis .arw {
  position: relative; flex: 1; width: 0; min-height: 34px;
  border-left: 1.5px solid var(--ae-cool-gray-300);
}
.axis .arw::before {
  content: ''; position: absolute; top: -7px; left: -4.5px;
  border-left: 4.5px solid transparent;
  border-right: 4.5px solid transparent;
  border-bottom: 7px solid var(--ae-cool-gray-300);
}
.axis .lab {
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1; font-weight: 600; letter-spacing: 0.04em;
  color: var(--fg-faint); white-space: nowrap;
}

/* ══════════════════════════════════════════════════════════════
   V1 — THE CLIMB
   The rungs as four platforms standing on one floor, rising left
   to right. Height is the whole encoding: you cannot look at this
   and think the four are interchangeable, and you cannot lose the
   ordering by desaturating it.

   The risers are deliberately uneven and each one is labelled with
   what it buys. 1 → 2 is a short step (the conversation is gone,
   the model is not); 2 → 3 is the tall one; 3 → 4 is the last one
   and it lands on ink.

   The floor is drawn. Without a common baseline four heights are
   four sizes, not four measurements.
   ══════════════════════════════════════════════════════════════ */
.v1 .climb {
  --pl: clamp(84px, 12.4vh, 146px);  /* the shortest platform */
  --r:  clamp(20px, 3.5vh, 46px);    /* one riser unit */
  display: grid;
  grid-template-columns: auto repeat(4, minmax(0, 1fr));
  grid-template-rows: auto auto auto;
  column-gap: var(--ae-space-3);
}
.v1 .axis { grid-row: 1; grid-column: 1; padding-bottom: 2px; }
.v1 .floor {
  grid-row: 1; grid-column: 1 / -1; align-self: end;
  height: 0; border-top: 2px solid var(--ae-cool-gray-400);
  transform-origin: left center;
  animation: v-extend 760ms var(--ae-ease) both;
  animation-delay: calc(60ms + 3 * var(--fg-beat));
}
@keyframes v-extend { from { transform: scaleX(0); } }

.v1 .col { grid-row: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.v1 .gain {
  margin-bottom: 7px; text-align: center;
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.25; font-weight: 600; color: var(--fg-faint);
}
.v1 .bar {
  height: var(--h);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: var(--ae-space-3);
  border-radius: var(--ae-radius) var(--ae-radius) 0 0;
  font-family: var(--ae-font-head); font-weight: 700;
  font-size: var(--ae-fs-h2); line-height: 1;
  font-variant-numeric: tabular-nums;
}
/* Four fills, four different forms: an empty dashed outline, a tinted
   solid outline, a filled plum block, a filled ink block. The step from
   3 to 4 is the step from coloured to ink and it is not decoration. */
.v1 .r1 .bar { background: transparent; border: 1.5px dashed var(--fg-review); border-bottom: 0; color: var(--fg-review); }
.v1 .r2 .bar { background: var(--fg-review-tint); border: 1.5px solid var(--fg-review); border-bottom: 0; color: var(--fg-review-d); }
.v1 .r3 .bar { background: var(--fg-review); color: #fff; box-shadow: var(--fg-d1); }
.v1 .r4 .bar { background: var(--fg-ink); color: #fff; box-shadow: var(--fg-d2); }

.v1 .t {
  grid-row: 2; margin: var(--ae-space-4) 0 0;
  font-family: var(--ae-font-head); font-weight: 600;
  font-size: var(--ae-fs-h4); line-height: 1.16; color: var(--fg-muted);
}
.v1 .t.r3 { color: var(--fg-review-d); }
.v1 .t.r4 { color: var(--fg-ink); font-weight: 700; }
.v1 .d {
  grid-row: 3; margin: var(--ae-space-2) 0 0;
  font-size: var(--ae-fs-small); line-height: 1.42; color: var(--fg-body);
}

/* ══════════════════════════════════════════════════════════════
   V2 — HOW FAR FROM THE AUTHOR
   The same order drawn as distance rather than height, and with
   the two things you have to cross drawn as barriers rather than
   left implied. Rungs 1 and 2 sit almost on top of each other on
   the near side of the model-family boundary — which is the note
   under the slide, made structural. Rung 3 is past it. Rung 4 is
   past the second boundary, the one no model crosses, and it is
   an ink bar ACROSS the track, not a marker on it: the same shape
   slide 7 gives a gate, because it is one.
   ══════════════════════════════════════════════════════════════ */
.v2 .run {
  display: grid;
  /* The column widths ARE the argument. Stations 1 and 2 get narrow
     columns and sit side by side; the two boundary columns are wide, so
     the centre-to-centre distance 2 → 3 is roughly twice 1 → 2, and
     3 → 4 is wider still. Even columns would have drawn four peers
     again, which is the defect this slide is here to fix.

     Column 7 holds the ink bar and nothing else, so the track can end
     ON it rather than running past it. A line that continues past the
     human would say there is something after the final say. */
  grid-template-columns:
    auto minmax(0, 0.95fr) minmax(0, 0.95fr) clamp(40px, 5.2vw, 132px)
    minmax(0, 1.15fr) clamp(56px, 8.2vw, 190px) auto minmax(0, 1.15fr);
  grid-template-rows: auto auto auto auto;
  column-gap: var(--ae-space-4);
  align-items: start;
}
.v2 .track {
  grid-row: 2; grid-column: 1 / 8; align-self: center;
  height: 3px; border-radius: 2px; background: var(--ae-cool-gray-300);
  transform-origin: left center;
  animation: v-extend 800ms var(--ae-ease) both;
  animation-delay: calc(60ms + 3 * var(--fg-beat));
}
.v2 .axistag {
  grid-row: 1; grid-column: 1 / 4; justify-self: start; align-self: end;
  margin-bottom: var(--ae-space-3);
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: var(--ae-lh-caption); font-weight: 600; color: var(--fg-faint);
}
/* The origin: where the code and the session that wrote it sit. Aligned
   to the START of its column, not the centre, so the track begins ON it.
   Centred, the line ran a few pixels out to the left of the origin and
   read as a stray tail. */
.v2 .orig { grid-row: 2; grid-column: 1; justify-self: start; align-self: center; z-index: 2; }
.v2 .orig i {
  display: block; width: 13px; height: 13px; border-radius: 3px;
  background: var(--ae-cool-gray-400);
}
.v2 .origlab {
  grid-row: 3; grid-column: 1; justify-self: start;
  margin: var(--ae-space-3) 0 0; max-width: 11ch;
  font-size: var(--ae-fs-caption); line-height: 1.25; color: var(--fg-faint);
}

/* The two boundaries. Dashed and full-depth, so they separate the text
   as well as the track. The second one is ink: it is the machine/human
   line, and the human side of it is the only side a person is on. */
.v2 .bl { grid-row: 2 / 5; justify-self: center; width: 0; align-self: stretch; z-index: 1; }
.v2 .bl--a { border-left: 2px dashed var(--ae-cool-gray-400); }
.v2 .bl--b { border-left: 2px dashed var(--fg-ink); }
.v2 .bllab {
  grid-row: 1; justify-self: center; align-self: end;
  margin-bottom: var(--ae-space-2);
  padding: 3px 11px; border-radius: 999px; white-space: nowrap;
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.2; font-weight: 600;
}
.v2 .bllab--a { background: var(--fg-paper); border: 1px dashed var(--ae-cool-gray-400); color: var(--fg-muted); }
.v2 .bllab--b { background: var(--fg-ink); color: #fff; }

/* Marker forms, in order: dashed ring · solid ring · filled disc ·
   ink bar across the line. Size grows with every one of them. */
.v2 .mk { grid-row: 2; justify-self: center; align-self: center; z-index: 2; }
.v2 .mk.r1 { width: 30px; height: 30px; border-radius: 999px; background: var(--fg-paper); border: 2px dashed var(--fg-review); }
.v2 .mk.r2 { width: 40px; height: 40px; border-radius: 999px; background: var(--fg-paper); border: 3px solid var(--fg-review); }
.v2 .mk.r3 { width: clamp(46px, 6.6vh, 58px); height: clamp(46px, 6.6vh, 58px); border-radius: 999px; background: var(--fg-review); box-shadow: var(--fg-d1); }
.v2 .mk.r4 {
  width: clamp(36px, 4.4vh, 50px); height: clamp(68px, 10.4vh, 106px);
  border-radius: 12px; background: var(--fg-ink); box-shadow: var(--fg-d2);
}
.v2 .t {
  grid-row: 3; margin: var(--ae-space-4) 0 0;
  display: flex; align-items: baseline; gap: var(--ae-space-2);
  font-family: var(--ae-font-head); font-weight: 600;
  font-size: var(--ae-fs-h4); line-height: 1.16; color: var(--fg-muted);
}
/* max(), not a bare em: at the smallest step of the type scale 0.78em
   computed to 13.26px and broke the deck's 14px floor. */
.v2 .t i {
  font-style: normal; font-size: max(14px, 0.78em); font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--fg-review);
}
.v2 .t.r3 { color: var(--fg-review-d); }
.v2 .t.r4 { color: var(--fg-ink); font-weight: 700; }
.v2 .t.r4 i { color: var(--fg-ink); }
.v2 .d {
  grid-row: 4; margin: var(--ae-space-2) 0 0;
  font-size: var(--ae-fs-small); line-height: 1.42; color: var(--fg-body);
}
/* The human's words sit past the ink bar, so they need clearance from
   it — the bar is a barrier, not a bullet the text hangs off. */
.v2 .t.r4, .v2 .d.r4 { padding-left: var(--ae-space-4); }

/* ══════════════════════════════════════════════════════════════
   V3 — OUT OF THE ROOM
   Not height and not distance: enclosure. Rungs 1 and 2 are inside
   the same model family — the same blind spots, twice — so they are
   drawn inside one box. Rung 3 is outside that box but still inside
   "a model". Rung 4 is outside both, on the bare paper, in ink,
   above everything. The reading runs top-down from the human back
   into the author's own session, which is where the headline says
   review cannot happen.

   This is the variation with room: the descriptions get a full-width
   column instead of a quarter of one, so nothing is compressed and
   German has space to run long.
   ══════════════════════════════════════════════════════════════ */
.v3 .nest { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--ae-space-4); }
.v3 .axis { grid-column: 1; padding: var(--ae-space-2) 0; }
.v3 .stack { grid-column: 2; display: flex; flex-direction: column; gap: var(--ae-space-6); }

.v3 .box { position: relative; border-radius: var(--ae-radius-lg); }
.v3 .box--outer {
  border: 1.5px solid var(--ae-cool-gray-300); background: var(--fg-card);
  box-shadow: var(--fg-d1);
  padding: var(--ae-space-7) var(--ae-space-5) var(--ae-space-6);
  display: flex; flex-direction: column; gap: var(--ae-space-7);
}
.v3 .box--inner {
  border: 1.5px dashed var(--fg-review); background: var(--fg-review-tint);
  padding: var(--ae-space-7) var(--ae-space-4) var(--ae-space-5);
  display: flex; flex-direction: column; gap: var(--ae-space-4);
}
/* The label sits ON the edge it names, so the box is not an unexplained
   rectangle. Its ground matches whatever is behind that edge. */
.v3 .box__lab {
  position: absolute; top: 0; left: var(--ae-space-5);
  transform: translateY(-50%);
  padding: 2px 11px; border-radius: 999px; white-space: nowrap;
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.25; font-weight: 600;
}
.v3 .box--outer > .box__lab { background: var(--fg-paper); border: 1px solid var(--ae-cool-gray-300); color: var(--fg-muted); }
.v3 .box--inner > .box__lab { background: var(--fg-card); border: 1px dashed var(--fg-review); color: var(--fg-review-d); }

/* Fixed marker and title columns, not fr: the three boxes have three
   different content widths, and fr columns made the description edges
   land 4px apart — near-aligned, which reads as a mistake. Fixed columns
   stagger the descriptions by exactly the indent of the box they are in,
   which is the nesting saying itself twice. */
.v3 .rung {
  display: grid;
  grid-template-columns: clamp(48px, 5.6vh, 62px) clamp(180px, 19vw, 300px) minmax(0, 1fr);
  column-gap: var(--ae-space-4); align-items: start;
}
.v3 .rung--out { padding: 0 var(--ae-space-5); }
.v3 .mk {
  flex: none; display: flex; align-items: center; justify-content: center;
  justify-self: start; margin-top: 1px; border-radius: 999px;
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
}
.v3 .r1 .mk { width: 34px; height: 34px; background: transparent; border: 1.5px dashed var(--fg-review); color: var(--fg-review); }
.v3 .r2 .mk { width: 37px; height: 37px; background: var(--fg-card); border: 2px solid var(--fg-review); color: var(--fg-review-d); }
.v3 .r3 .mk { width: 42px; height: 42px; background: var(--fg-review); color: #fff; box-shadow: var(--fg-d1); }
/* Square, not a ring: a person is not one more node on the machine's
   line, and the shape says so before the colour does. */
.v3 .r4 .mk { width: 48px; height: 48px; border-radius: 13px; background: var(--fg-ink); color: #fff; box-shadow: var(--fg-d2); font-size: var(--ae-fs-h5); }

.v3 .t {
  margin: 0;
  font-family: var(--ae-font-head); font-weight: 600;
  font-size: var(--ae-fs-h4); line-height: 1.2; color: var(--fg-muted);
}
.v3 .r3 .t { color: var(--fg-review-d); }
.v3 .r4 .t { color: var(--fg-ink); font-weight: 700; font-size: var(--ae-fs-h3); line-height: 1.1; }
.v3 .d {
  margin: 0; font-size: var(--ae-fs-body); line-height: 1.42; color: var(--fg-body);
}
.v3 .r4 .d { color: var(--fg-ink); }

@media print {
  .v1 .floor, .v2 .track { animation: none !important; }
}

@media (max-width: 900px) {
  .v1 .climb { grid-template-columns: 1fr; row-gap: var(--ae-space-4); }
  .v1 .axis, .v1 .floor { display: none; }
  .v1 .col, .v1 .t, .v1 .d { grid-row: auto; grid-column: 1 !important; }
  .v1 .bar { height: auto; padding: var(--ae-space-3); border-radius: var(--ae-radius); }
  .v2 .run { grid-template-columns: 1fr; row-gap: var(--ae-space-4); }
  .v2 .track, .v2 .bl, .v2 .bllab, .v2 .orig, .v2 .origlab, .v2 .axistag { display: none; }
  .v2 .mk, .v2 .t, .v2 .d { grid-row: auto; grid-column: 1 !important; }
  .v3 .nest { grid-template-columns: 1fr; }
  .v3 .axis { display: none; }
  .v3 .stack { grid-column: 1; }
  .v3 .rung { grid-template-columns: auto minmax(0, 1fr); }
  .v3 .rung .d { grid-column: 2; margin-top: 4px; }
}
</style>
</head>
<body>

<header id="header">
  <div class="header-inner" style="padding: 0 20px;">
    <div class="hb">
      <div class="lang-toggle" id="tabs" role="group" aria-label="Variation">
        <button type="button" data-p="v1">1 · Climb</button>
        <button type="button" data-p="v2">2 · Distance</button>
        <button type="button" data-p="v3">3 · Out of the room</button>
      </div>
    </div>
    <span class="page-title" id="subtitle"></span>
    <span class="header-right">
      <button class="ae-btn ae-btn--secondary ae-btn--small" id="btn-grey" type="button">Greyscale</button>
      <button class="ae-btn ae-btn--secondary ae-btn--small" id="btn-replay" type="button">↻ Replay</button>
      <div class="lang-toggle" id="langs" role="group" aria-label="Language">
        <button type="button" data-l="en">EN</button>
        <button type="button" data-l="de">DE</button>
      </div>
    </span>
  </div>
</header>

<main id="stage"></main>

<script>
/* Verbatim from presentation-v2/sections/22-review-independent.js: the
   headline, the lede, all four rung titles and descriptions, the note.
   New strings, and only these, because a drawing needs labels the table
   did not:
     axis / dist  — what the geometry measures, said out loud once
     gains        — what each riser buys (V1). Each is a compression of
                    the description of the rung above it, not a new claim
     bounds/boxes — the two things you cross: the model family, and the
                    machine. Both are stated in the rung descriptions
     origin       — where the run starts: the code itself                */
const C = {
  en: {
    h1: 'The session that wrote the code cannot review it',
    lede: 'It re-reads its own reasoning and finds it correct, because it is the same reasoning. Independence is not a mood; it is a property of who is asked.',
    axis: 'Independence',
    dist: 'How far from the author →',
    origin: 'the code',
    rungs: [
      { n: '1', t: 'The same session',
        d: 'Typos, and nothing else. It inherits every assumption of the code it just wrote, including the wrong ones.' },
      { n: '2', t: 'A fresh session, same model',
        d: 'The conversational bias is gone. The model family’s blind spots are not — it will make the same class of mistake reading as it made writing.' },
      { n: '3', t: 'A different model family',
        d: 'Independent failure modes. One model builds, another reads. This is the rung that catches the test that cannot fail.' },
      { n: '4', t: 'A person',
        d: 'The final say on what counts as done — which is a question about intent, and no model has access to yours.' },
    ],
    gains: ['+ no conversational bias', '+ different blind spots', '+ access to your intent'],
    bounds: ['the same model family', 'still a machine'],
    boxes: ['a model, either way', 'the same model family'],
    note: 'A second pass from the same model is a <b>separate session</b>, not an independent review. Both are worth doing. Only one of them is independence.',
  },
  de: {
    h1: 'Die Session, die den Code geschrieben hat, kann ihn nicht reviewen',
    lede: 'Sie liest ihre eigene Argumentation nach und findet sie richtig, weil es dieselbe Argumentation ist. Unabhängigkeit ist keine Haltung, sondern eine Eigenschaft dessen, wer gefragt wird.',
    axis: 'Unabhängigkeit',
    dist: 'Wie weit weg vom Autor →',
    origin: 'der Code',
    rungs: [
      { n: '1', t: 'Dieselbe Session',
        d: 'Tippfehler, sonst nichts. Sie erbt jede Annahme des Codes, den sie gerade geschrieben hat — auch die falschen.' },
      { n: '2', t: 'Neue Session, gleiches Modell',
        d: 'Die Gesprächsverzerrung ist weg. Die blinden Flecken der Modellfamilie nicht — sie macht beim Lesen denselben Fehlertyp wie beim Schreiben.' },
      { n: '3', t: 'Eine andere Modellfamilie',
        d: 'Unabhängige Fehlermodi. Ein Modell baut, ein anderes liest. Diese Stufe findet den Test, der nicht scheitern kann.' },
      { n: '4', t: 'Ein Mensch',
        d: 'Das letzte Wort darüber, was als fertig gilt — eine Frage nach der Absicht, und auf deine hat kein Modell Zugriff.' },
    ],
    gains: ['+ keine Gesprächsverzerrung', '+ andere blinde Flecken', '+ Zugang zu deiner Absicht'],
    bounds: ['dieselbe Modellfamilie', 'immer noch eine Maschine'],
    boxes: ['so oder so ein Modell', 'dieselbe Modellfamilie'],
    note: 'Ein zweiter Durchgang desselben Modells ist eine <b>separate Session</b>, kein unabhängiges Review. Beides lohnt sich. Unabhängigkeit ist nur eines davon.',
  },
};

const SUB = {
  v1: 'Variation 1 — the climb: four platforms on one floor, uneven risers, ink at the top',
  v2: 'Variation 2 — distance: two boundaries to cross, and rungs 1 and 2 on the same side of both',
  v3: 'Variation 3 — out of the room: the human outside every box the machines are in',
};

function axis(t) {
  return '<div class="axis fg-in" style="--fg-at:3">'
    + '<i class="arw" aria-hidden="true"></i>'
    + '<span class="lab">' + t.axis + '</span>'
  + '</div>';
}

/* ── V1 ── the four platform heights, in riser units off a common floor.
   0 · 0.8 · 2.6 · 3.9 — the 1.8-unit gap between rungs 2 and 3 is more
   than twice any other, which is the argument. */
const H = [0, 0.8, 2.6, 3.9];

function V1(t) {
  var out = '<div class="climb">' + axis(t) + '<i class="floor" aria-hidden="true"></i>';
  t.rungs.forEach(function (r, i) {
    var col = 'grid-column:' + (i + 2) + ';';
    var at = 4 + i;
    out += '<div class="col r' + (i + 1) + '" style="' + col + '">'
      + (i ? '<span class="gain fg-in" style="--fg-at:' + at + '">' + t.gains[i - 1] + '</span>' : '')
      + '<div class="bar fg-in" style="--fg-at:' + at + '; --h: calc(var(--pl) + ' + H[i] + ' * var(--r))">' + r.n + '</div>'
    + '</div>'
    + '<h3 class="t r' + (i + 1) + ' fg-in" style="' + col + ' --fg-at:' + at + '">' + r.t + '</h3>'
    + '<p class="d fg-in" style="' + col + ' --fg-at:' + at + '">' + r.d + '</p>';
  });
  return out + '</div>';
}

/* ── V2 ── markers in columns 2, 3, 5 and 7; boundaries in 4 and 6.
   The human's marker has a column to itself so the track can stop on it;
   its words therefore sit in column 8, on the far side of the barrier. */
const MK_COL = [2, 3, 5, 7];
const TX_COL = [2, 3, 5, 8];

function V2(t) {
  var out = '<div class="run">'
    + '<i class="track" aria-hidden="true"></i>'
    + '<span class="axistag fg-in" style="--fg-at:3">' + t.dist + '</span>'
    + '<div class="orig fg-in" style="--fg-at:3"><i></i></div>'
    + '<p class="origlab fg-in" style="--fg-at:3">' + t.origin + '</p>'
    + '<i class="bl bl--a fg-in" aria-hidden="true" style="grid-column:4; --fg-at:6"></i>'
    + '<span class="bllab bllab--a fg-in" style="grid-column:4; --fg-at:6">' + t.bounds[0] + '</span>'
    + '<i class="bl bl--b fg-in" aria-hidden="true" style="grid-column:6; --fg-at:8"></i>'
    + '<span class="bllab bllab--b fg-in" style="grid-column:6; --fg-at:8">' + t.bounds[1] + '</span>';
  t.rungs.forEach(function (r, i) {
    var mc = 'grid-column:' + MK_COL[i] + ';';
    var tc = 'grid-column:' + TX_COL[i] + ';';
    var at = 4 + i;
    out += '<i class="mk r' + (i + 1) + ' fg-in" aria-hidden="true" style="' + mc + ' --fg-at:' + at + '"></i>'
      + '<h3 class="t r' + (i + 1) + ' fg-in" style="' + tc + ' --fg-at:' + at + '"><i>' + r.n + '</i>' + r.t + '</h3>'
      + '<p class="d r' + (i + 1) + ' fg-in" style="' + tc + ' --fg-at:' + at + '">' + r.d + '</p>';
  });
  return out + '</div>';
}

/* ── V3 ── */
function rung(r, i, extra) {
  return '<div class="rung r' + (i + 1) + ' ' + (extra || '') + ' fg-in" style="--fg-at:' + (4 + i) + '">'
    + '<span class="mk">' + r.n + '</span>'
    + '<h3 class="t">' + r.t + '</h3>'
    + '<p class="d">' + r.d + '</p>'
  + '</div>';
}

function V3(t) {
  var r = t.rungs;
  return '<div class="nest">' + axis(t)
    + '<div class="stack">'
      + rung(r[3], 3, 'rung--out')
      + '<div class="box box--outer fg-in" style="--fg-at:5">'
        + '<span class="box__lab">' + t.boxes[0] + '</span>'
        + rung(r[2], 2)
        + '<div class="box box--inner">'
          + '<span class="box__lab">' + t.boxes[1] + '</span>'
          + rung(r[1], 1)
          + rung(r[0], 0)
        + '</div>'
      + '</div>'
    + '</div>'
  + '</div>';
}

const BODY = { v1: V1, v2: V2, v3: V3 };

function render(v, t) {
  return ''
  + '<section class="proto ' + v + '">'
    + '<div class="fg-wrap head">'
      + '<h1 class="fg-in" style="--fg-at:1">' + t.h1 + '</h1>'
      + '<p class="fg-lede fg-in" style="--fg-at:2">' + t.lede + '</p>'
    + '</div>'
    + '<div class="fg-wrap body">' + BODY[v](t) + '</div>'
    + '<div class="fg-wrap foot"><p class="fg-note fg-in" style="--fg-at:9"><span>' + t.note + '</span></p></div>'
  + '</section>';
}

let lang = 'en', proto = 'v1';
const stage = document.getElementById('stage');
function mount() {
  document.getElementById('subtitle').textContent = SUB[proto];
  stage.innerHTML = render(proto, C[lang]);
  const sync = (sel, key, val) => document.querySelectorAll(sel + ' button')
    .forEach(b => b.classList.toggle('active', b.dataset[key] === String(val)));
  sync('#tabs', 'p', proto); sync('#langs', 'l', lang);
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; proto = b.dataset.p; mount(); });
document.getElementById('langs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; mount(); });
document.getElementById('btn-replay').addEventListener('click', mount);
document.getElementById('btn-grey').addEventListener('click', () => document.body.classList.toggle('grey'));
document.addEventListener('keydown', e => { if (['1','2','3'].includes(e.key)) { proto = 'v' + e.key; mount(); } });
mount();
</script>
</body>
</html>
