<style>
/* ══════════════════════════════════════════════════════════════════════
   HARNESS

   THE ARTIFACT SELECTOR IS GONE. It was chrome doing the slide's job.
   In treatments 4–6 the four cards down the rail ARE the selector, and
   in 1–3 the crumb segments now are — so every treatment navigates
   itself and the row that used to sit here has nothing left to do.

   THE SECOND ROW STAYS, EMPTY OF CONTROLS, BECAUSE IT IS MEASURING.
   The real deck's stage is a viewport minus header (55px) and nav bar
   (55px). Drop this row and two things go wrong at once: the stage
   measures 55px too tall, AND every clamp(px, vh, px) token in the deck
   resolves against a viewport that no longer matches the one the deck
   runs at — so the type comes out a size the real slide never renders.
   Keeping 110px of chrome keeps BOTH true: viewport 1280x720 here is
   viewport 1280x720 there, and this stage is that stage. The row now
   carries the treatment's description, which used to sit in the header.
   ══════════════════════════════════════════════════════════════════════ */
.hb { justify-self: start; display: flex; align-items: center; gap: 10px; }
#header .header-right { display: flex; align-items: center; gap: 10px; }
#btn-replay, #btn-grey { font-size: 12.5px; padding: 5px 12px; min-height: 0; }
/* Nine treatments do not fit the toolbar at the shell's own button size,
   and a wrapped tab row silently makes the header taller than the deck's
   55px — which would put every measurement below out by the difference. */
#tabs button { font-size: 11.5px; padding: 5px 8px; white-space: nowrap; }

#toolbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  /* 55px, measured, not guessed: the real nav is 10px + a 34px button +
     10px + a 1px top border. Header 55 + nav 55 = 110, so this stage is
     the deck's stage and every number below transfers unadjusted. */
  min-height: 55px;
  padding: 6px var(--ae-gutter);
  background: var(--fg-paper);
  border-bottom: 1px solid var(--fg-hair);
}
#toolbar .tb-desc {
  font-family: var(--ae-font); font-size: 13px; line-height: 1.3;
  color: var(--fg-muted); text-align: center;
}
#toolbar .tb-desc b { color: var(--fg-ink); font-weight: 600; }

#stage > .proto {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: var(--ae-space-5) var(--ae-gutter);
  background: var(--fg-paper); overflow: auto;
}
body.grey #stage { filter: saturate(0); }

/* ══════════════════════════════════════════════════════════════════════
   SHARED — THE EXHIBIT DEVICE

   DESIGN.md's verdict on 29–32 is the same four times: "agrees — exhibit,
   a real file. Leave, but fill more frame." So this is one device treated
   three ways, not three designs. Everything in this block is common to
   all three treatments; only the layout blocks below differ.

   FOUR THINGS ARE FIXED HERE, IN ALL THREE TREATMENTS, BECAUSE THEY ARE
   CORRECTIONS RATHER THAN CHOICES:

   1. THE THIRD VERDICT EXISTS NOW. The shipped device renders "not
      verified" through the same class as a failure, in --ae-error, with
      no glyph at all — so the deck's loudest claim, that a truthful
      PENDING beats a convincing PASS, is drawn as if PENDING were a
      failure and is carried by hue alone. Here a verdict is a colour AND
      a glyph: pass = green + tick, not verified = ochre + hollow ring,
      wrong = clay + cross. The unverified row also takes an ochre wash,
      which is what makes it the climax of slide 32 rather than the last
      line of a table. Clay is kept live in the legend even though this
      record never uses it, because the legend is teaching the palette.

   2. NOTHING IS SET BELOW THE FLOOR. The shipped device multiplies
      --ae-fs-small by 0.88 and --ae-fs-caption by 0.92. At a 1280x720
      stage both of those tokens are already clamped to their minimum, so
      the multipliers produce 13.2px source and 12.9px frontmatter —
      under the deck's own 14px floor. The multipliers are gone. This
      makes the fit problem HARDER, not easier, and it is why the source
      sits close to the floor at 720.

   3. GREEN IS NOT "YOU ARE HERE" ANY MORE. The shipped crumb fills the
      active pill with --fg-green, which since pass 4 means Build. Each
      artifact now carries the hue of the loop step it belongs to — spec
      and plan are Plan, tasks is Build (the slide shows it mid-flight,
      being worked), verification is Review — and a small locator names
      that step, because a chapter hue must always travel with the
      chapter's name. It is also what stops the four slides from being
      four identical green pictures.

   4. THE FRONTMATTER IS THE REAL CONTRACT. sdd/README.md requires eight
      fields; the slide showed four, and dropped the one the README
      argues hardest for. Eight now, plus the real repo path on the
      sheet, so a viewer can check the claim against the repo. See the
      report for the one field that contradicts its own slide.
   ══════════════════════════════════════════════════════════════════════ */

.proto .head { flex: none; margin-bottom: var(--ae-space-3); }
.proto .body { flex: 1; display: flex; flex-direction: column; justify-content: safe center; min-height: 0; }
.proto .foot { flex: none; margin-top: var(--ae-space-3); }

.hrow {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--ae-space-5); flex-wrap: wrap;
}
.proto h1 {
  margin: 0; font-size: var(--ae-fs-h2); line-height: var(--ae-lh-h2);
  color: var(--fg-ink);
}

/* ── the artifact's loop hue ────────────────────────────────────────── */
.a-plan   { --hue: var(--fg-plan);   --hue-d: var(--fg-plan-d);   --hue-tint: var(--fg-plan-tint); }
.a-build  { --hue: var(--fg-build);  --hue-d: var(--fg-build-d);  --hue-tint: var(--fg-build-tint); }
.a-review { --hue: var(--fg-review); --hue-d: var(--fg-review-d); --hue-tint: var(--fg-review-tint); }

/* ── the locator: which step of the loop this document belongs to ──── */
.loc { display: flex; align-items: center; gap: var(--ae-space-2); }
.loc .dot {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.2; font-weight: 600; color: var(--ae-text-disabled);
}
.loc .dot::before {
  content: ''; width: 9px; height: 9px; border-radius: 999px;
  background: var(--ae-cool-gray-200);
}
.loc .dot.on { color: var(--hue-d); font-weight: 700; }
.loc .dot.on::before { background: var(--hue); box-shadow: 0 0 0 4px var(--hue-tint); }
.loc .sep { width: 14px; height: 2px; background: var(--fg-hair); }

/* ── the crumb: which of the four ──────────────────────────────────── */
/* Now a control, not a label. Treatments 1 and 3 kept their crumb when
   the harness lost its artifact row, so the crumb has to be able to do
   what the row did — otherwise the three old treatments become
   unreachable and the comparison they exist for is gone. */
.crumb { display: flex; align-items: center; gap: var(--ae-space-2); flex-wrap: wrap; }
.crumb .seg {
  appearance: none; margin: 0; cursor: pointer; background: transparent;
  font-family: var(--ae-font-mono); font-size: var(--ae-fs-caption);
  line-height: 1; color: var(--fg-faint);
  padding: 5px 11px; border-radius: 100px; border: 1px solid var(--fg-hair);
}
.crumb .seg:hover { color: var(--fg-ink); border-color: var(--fg-muted); }
/* Filled versus hollow, not hue versus hue: the active segment survives
   the greyscale test on its fill alone. */
.crumb .seg--on {
  color: #fff; background: var(--hue); border-color: var(--hue); font-weight: 700;
}
.crumb .sep { color: var(--ae-cool-gray-300); font-weight: 700; }

/* ── the sheet ─────────────────────────────────────────────────────── */
.sheet {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--fg-card);
  border: 1px solid var(--fg-hair);
  border-radius: var(--ae-radius-lg);
  box-shadow: var(--fg-d1);
  overflow: hidden;
}
.sheet__bar {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--ae-space-4); flex-wrap: wrap;
  padding: var(--ae-space-2) var(--ae-space-5);
  background: var(--ae-cool-gray-100);
  border-bottom: 1px solid var(--fg-hair);
}
.path {
  font-family: var(--ae-font-mono); font-size: var(--ae-fs-caption);
  line-height: 1.3; color: var(--fg-muted);
}
.path b { color: var(--fg-ink); font-weight: 600; }

/* Frontmatter is file source, so it is mono — but it is metadata about
   the document rather than the document, so it sits in the header well
   and the keys recede. */
.fm {
  flex: none;
  display: flex; flex-wrap: wrap;
  gap: 3px var(--ae-space-5);
  padding: var(--ae-space-2) var(--ae-space-5);
  background: var(--ae-cool-gray-100);
  border-bottom: 1px solid var(--fg-hair);
  font-family: var(--ae-font-mono);
  font-size: var(--ae-fs-caption); line-height: 1.35;
  color: var(--fg-ink);
}
.fm .k { color: var(--fg-faint); }

/* ── the document body ─────────────────────────────────────────────── */
.src { font-family: var(--ae-font-mono); font-size: var(--src-fs); line-height: 1.5; }
.ln { color: var(--fg-ink); }
.ln + .ln { margin-top: 1px; }
/* The markdown markers are source, not decoration, and they are what
   carries heading-versus-item and done-versus-open when the hue is gone.
   --fg-faint rather than a hairline grey: this is text and it is read. */
.mk { color: var(--fg-faint); }
.h { font-weight: 700; margin-top: 0.5em; }
.h b { font-weight: 700; }
.sec > .h:first-child, .src > .h:first-child { margin-top: 0; }
.p { color: var(--fg-body); }
.li, .done, .todo { padding-left: 1.5em; text-indent: -1.5em; }
.done { color: var(--fg-build-d); }
.done .mk { color: var(--fg-build); font-weight: 700; }
.todo { color: var(--fg-ink); }
.gap { height: 0.5em; }

/* ── the verification table ────────────────────────────────────────── */
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) auto;
  gap: var(--ae-space-3);
  padding: 3px 0;
  border-bottom: 1px solid var(--fg-hair);
  color: var(--fg-ink);
}
.row--head { color: var(--fg-faint); border-bottom-color: var(--ae-cool-gray-300); }
.row span:last-child { text-align: right; }
/* The unverified row is the point of slide 32. Ochre wash, bled to the
   sheet's inner edge so it reads as a band rather than a highlighted
   word, and it still carries its own glyph. */
.row--wait {
  background: var(--fg-wait-tint);
  border-bottom-color: var(--fg-wait-light);
  margin: 0 calc(-1 * var(--ae-space-5));
  padding: 3px var(--ae-space-5);
}

/* ── the three verdicts ────────────────────────────────────────────── */
.v {
  display: inline-flex; align-items: baseline; gap: 0.34em;
  font-weight: 700; white-space: nowrap;
}
/* The glyph takes the BODY face even inside the mono document. In Plex
   Mono U+2713 sets as a square-shouldered radical and reads as √; in the
   legend, which is prose and therefore Inter, the same character is a
   tick. A legend that teaches ✓ beside a table that draws √ is teaching
   the wrong mark. styles.css already states the principle for the nav
   chevron: a glyph is not code and does not take the code face. */
.v::before { flex: none; font-weight: 700; font-family: var(--ae-font); }
.v--pass { color: var(--fg-build-d); }
.v--pass::before { content: '\2713'; }
/* A hollow ring, not the typographic white bullet DESIGN.md writes the
   verdict with: at body size U+25E6 sets as a raised dot and reads as a
   degree sign rather than as "open". U+25CB is the same idea at a size
   the back row can tell apart from the tick. */
.v--wait { color: var(--fg-wait-d); }
.v--wait::before { content: '\25CB'; font-size: 0.85em; }
.v--fail { color: var(--fg-fail-d); }
.v--fail::before { content: '\2715'; }
.row span:last-child .v { justify-content: flex-end; }

/* The legend is prose about the file, not the file, so it takes the body
   face. It appears only on a document that carries verdicts. */
.key {
  flex: none;
  display: flex; flex-wrap: wrap; align-items: baseline;
  gap: 2px var(--ae-space-5);
  padding: var(--ae-space-2) var(--ae-space-5);
  background: var(--ae-cool-gray-100);
  border-top: 1px solid var(--fg-hair);
  font-family: var(--ae-font);
  font-size: var(--ae-fs-caption); line-height: 1.3;
}
.key .kl { color: var(--fg-faint); font-weight: 600; }
.key .v { font-weight: 600; }

.proto .fg-note { padding: var(--ae-space-3) var(--ae-space-5); }

/* ══════════════════════════════════════════════════════════════════════
   SHARED — ONE SLIDE, FOUR DOCUMENTS  (treatments 4, 5 and 6)

   Four slides collapse into one. The rail stops being a picture of a set
   and becomes the way through it: click a card, the sheet shows that
   document. This is only allowed because the deck is two artifacts at
   once — a talk, and a thing a reader clicks through alone — and the
   click serves the second without costing the first anything, since the
   presenter simply arrives with spec.md open and clicks three times
   where they used to press the arrow key three times.

   FOUR RULES HOLD IN ALL THREE, BECAUSE THEY ARE WHAT MAKES A CLICKABLE
   SLIDE HONEST RATHER THAN A DEMO:

   1. IT IS A BUTTON. Not a div with a click handler. Tab reaches it,
      Space and Enter fire it, arrow keys walk the rail, Home and End
      jump to the ends. A slide that can only be operated with a mouse
      is a slide half the room cannot operate.

   2. IT DEGRADES TO A SLIDE. The first artifact is rendered at mount.
      If nobody ever clicks — projector, PDF export, a script that
      screenshots — what is on screen is a complete, correct slide about
      spec.md, not an empty shell waiting for an event.

   3. THE STATE IS NEVER ONLY COLOUR. An open card is white where the
      others are grey, raised where the others are flat, larger where the
      others are small, and bound to the sheet where the others stand
      clear of it. Hue is the fifth cue, not the first.

   4. THE ENTRANCE PLAYS ONCE. Re-running the rise animation on every
      click turns a navigation control into a strobe. A click renders
      settled; only Replay and a language change replay the choreography.
   ══════════════════════════════════════════════════════════════════════ */
.rail { display: grid; min-height: 0; }
.tab {
  appearance: none; margin: 0; color: inherit; font: inherit;
  text-align: left; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
}
/* Ink, not the chapter hue: --fg-ink is the human and every human
   decision, and a focus ring is exactly where the human is standing. */
.tab:focus-visible, .crumb .seg:focus-visible {
  outline: 2px solid var(--fg-ink); outline-offset: 2px; z-index: 3;
}
/* The affordance has to survive a screenshot. A presenter looking at a
   still of this slide, or a reader who has not moved the mouse yet, gets
   a chevron on every closed card and none on the open one. */
.tab .go { flex: none; color: var(--fg-faint); font-weight: 700; }
.tab--on .go { display: none; }
.settled .fg-in, .settled .fg-mark--sweep { animation: none; }

/* ── the takeaway, three ways, none of them the mint box ───────────────
   The mint .fg-note is the deck's generic "here is the point" band, and
   under a document exhibit it reads as a fifth object stuck to the
   bottom of a slide that already has four. Each treatment below places
   the same sentence somewhere it belongs to something:
     4 — inside the open card, so it is the artifact's own line;
     5 — in the sheet's footer well, so it is the document's last line;
     6 — in the margin, bracketed to the band that earns it.
   All three are typographic and INK. No fill, no chapter hue: the
   takeaway is addressed to the person in the room, and ink is what this
   deck says a person with is. That also makes it greyscale-proof by
   construction rather than by test. */
/* The hanging arrow is a text-indent, NOT a flex row. As a flex row the
   sentence becomes an anonymous flex item, which cannot be given
   min-width:0, so in the narrow rail of treatment 4 the German
   "wahrheitsgemäß" pushed 31px out through the side of the card. A
   negative text-indent hangs the same arrow with no flex box to fail. */
.tk {
  display: block;
  padding-left: 1.15em; text-indent: -1.15em;
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.4; color: var(--fg-body);
  overflow-wrap: break-word;
}
.tk::before { content: '\2192\00a0'; color: var(--fg-ink); font-weight: 700; }
.tk b { font-weight: 700; color: var(--fg-ink); }

/* The chapter kicker, exactly as slide 28 sets it. */
.proto .kicker {
  margin: 0 0 var(--ae-space-1);
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: var(--ae-lh-caption); font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-green);
}

/* ══════════════════════════════════════════════════════════════════════
   T1 — THE PAGE
   The conservative reading of the verdict: the shape is right, so give
   it the frame. The sheet is stretched to the full body band and the
   crumb moves into the sheet's own tab bar, which buys back a whole
   standalone row. Fill comes from FIDELITY — the real path, the whole
   frontmatter contract, source at full reading size — rather than from
   any new furniture.

   The remaining slack is spent BETWEEN SECTIONS, not inside them. The
   source is a grid of markdown sections with stretched auto rows, so
   whatever height is left over lands where a well-set page would put it:
   in the space between "## Context" and "## Acceptance criteria". A line
   of source never gets stretched leading.
   ══════════════════════════════════════════════════════════════════════ */
.v1 { --src-fs: clamp(15px, 2.15vh, 23px); }
.v1 .sheet { flex: 1; }
.v1 .src {
  flex: 1; min-height: 0;
  display: grid; align-content: stretch; align-items: start;
  row-gap: var(--ae-space-3);
  padding: var(--ae-space-4) var(--ae-space-5);
}
/* The trailing row is what stops a SHORT document from being pulled
   apart. Stretch shares the leftover height equally between auto rows,
   so with bands alone tasks.md — three bands, eight one-line items —
   got 65px between its sections and read as if content were missing.
   One extra row takes a share as bottom margin and the gaps drop by a
   third, which is what a short file in an editor actually looks like. */
.v1 .src .fill, .v2 .src .fill { display: block; }

/* ══════════════════════════════════════════════════════════════════════
   T2 — THE BINDER
   The four artifacts are a SET, and the shipped slide says so in a
   horizontal pill row that costs a line and reads as furniture. Here the
   set is the left edge of the frame: four tabs down a rail, stretched to
   the sheet's full height, with the open one carrying the slide's title.

   THE TITLE IS THE TAB. Every word of the h1 is still on screen —
   "spec.md" at heading size, "what and why" under it in the mint mark —
   it is just on the tab instead of above it. That is what pays for the
   rail: the slide spends no vertical space on a heading at all, so the
   sheet gets the whole band, and the three unopened tabs answer "what
   are the other three for" without a word of new prose.

   The sheet is squared off on its bound edge and the open tab overlaps
   it by a pixel, so tab and sheet read as one object rather than as a
   menu next to a card.
   ══════════════════════════════════════════════════════════════════════ */
.v2 { --src-fs: clamp(15px, 2.0vh, 22px); }
.v2 .body { display: grid; grid-template-columns: minmax(190px, 0.3fr) minmax(0, 1fr); }
/* Four rows, no fifth. The locator used to head the rail, which pushed
   the first tab 77px below the sheet's top edge and made the binder read
   as a menu standing next to a card. It now sits in the sheet's own bar,
   where treatment 1 puts the crumb, and the four tabs run exactly the
   height of the thing they open. */
.v2 .rail {
  display: grid;
  grid-template-rows: repeat(4, minmax(min-content, 1fr));
  row-gap: 3px;
  min-height: 0;
  padding-right: 1px;
}
.v2 .tab {
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
  padding: var(--ae-space-3) var(--ae-space-4);
  border-radius: var(--ae-radius-lg) 0 0 var(--ae-radius-lg);
  /* A closed tab is still a tab: paper fill and a hairline on three
     sides, so the rail reads as a stack of four rather than as four
     labels floating in the gutter. */
  background: var(--ae-cool-gray-100);
  border: 1px solid var(--fg-hair); border-right: 0;
  min-width: 0;
}
/* A closed tab is quiet, not switched off. --ae-text-disabled is the one
   grey the kit lets fail AA, and it is wrong here: these four labels are
   the questions the four documents answer, which is content the back row
   should be able to read. Both values clear AA on the tab fill. */
.v2 .tab .f {
  margin: 0; font-family: var(--ae-font-mono);
  font-size: var(--ae-fs-caption); line-height: 1.2;
  font-weight: 600; color: var(--fg-muted);
  overflow-wrap: anywhere;
}
.v2 .tab .q {
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.25; color: var(--fg-faint);
}
/* Open: white, raised, bound to the sheet, and hued on its outer edge.
   Four cues, only one of which is colour. */
.v2 .tab--on {
  background: var(--fg-card);
  border-color: var(--fg-hair);
  box-shadow: inset 5px 0 0 var(--hue), var(--fg-d1);
  margin-right: -1px; z-index: 1;
  padding-left: calc(var(--ae-space-4) + 5px);
}
.v2 .tab--on .f {
  font-family: var(--ae-font-mono);
  font-size: var(--ae-fs-h3); line-height: var(--ae-lh-h3);
  font-weight: 700; color: var(--fg-ink); letter-spacing: -0.01em;
}
.v2 .tab--on .q {
  font-size: var(--ae-fs-body); line-height: 1.25; color: var(--fg-ink);
}
.v2 .rail .th { margin: 0; display: contents; }
.v2 .sheet { border-radius: 0 var(--ae-radius-lg) var(--ae-radius-lg) 0; }
.v2 .src {
  flex: 1; min-height: 0;
  display: grid; align-content: stretch; align-items: start;
  row-gap: var(--ae-space-3);
  padding: var(--ae-space-4) var(--ae-space-5);
}

/* ══════════════════════════════════════════════════════════════════════
   T3 — THE MARGIN
   Pass 1 calls slide 9 "exhibit + annotation — rules should point AT the
   prompt". These four are the same kind of object and never got that
   treatment. Here the sheet has a margin rail, and each markdown section
   has a note beside it saying what to notice in that band.

   ALIGNMENT IS STRUCTURAL, NOT NUDGED. A section and its note are the
   two cells of one grid row, so a note lands beside its section by
   construction and stays there when the German wraps to three lines.
   Section bands are separated by a hairline that crosses both columns,
   which is what makes the pairing readable without a single connector.

   THE FACE IS THE FORM CUE. The document is mono because it is file
   source; the margin is Inter because it is a reading of that source.
   Nobody can mistake the annotation for part of the file, in colour or
   out of it.

   This is the only treatment where slide 32's ochre row gets a note of
   its own — it is its own band, so the deck's sharpest claim gets
   pointed at rather than left to the caption.
   ══════════════════════════════════════════════════════════════════════ */
.v3 { --src-fs: clamp(15px, 1.95vh, 21px); }
.v3 .sheet { flex: 1; }
/* 0.4fr, not 0.5fr. The margin is a margin: at half the source column the
   annotations were wider than several of the lines they annotate, and the
   source wrapped enough extra times to overrun the sheet in German. The
   note column is sized by the longest note, not by symmetry. */
.v3 .ann {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.36fr);
  align-content: stretch;
}
/* Both cells centre their content. When a band has more height than its
   source needs — tasks.md at 1080, where nine lines are asked to hold a
   700px sheet — top-aligned source next to a centred note stopped
   reading as a pair. Centring both keeps the pairing at every height. */
.v3 .acell { padding: 5px var(--ae-space-4); display: flex; flex-direction: column; justify-content: center; }
.v3 .asrc > .src { width: 100%; }
.v3 .src { line-height: 1.4; }
.v3 .ln + .ln { margin-top: 0; }
.v3 .h { margin-top: 0.32em; }
.v3 .row { padding: 1px 0; gap: var(--ae-space-2); }
/* The wash spans the whole source cell, so it butts against the margin
   rule and continues into the ochre note on the other side of it: one
   band across the sheet rather than a highlighted strip inside it. */
.v3 .row--wait { padding: 1px var(--ae-space-4); margin: 0 calc(-1 * var(--ae-space-4)); }
.v3 .gap { height: 0.25em; }
.v3 .fg-note { padding: var(--ae-space-2) var(--ae-space-5); }
.v3 .acell.brd { border-top: 1px solid var(--fg-hair); }
.v3 .anote {
  background: var(--fg-paper);
  border-left: 1px solid var(--fg-hair);
}
.v3 .anote p {
  margin: 0; width: 100%;
  font-family: var(--ae-font);
  font-size: var(--ae-fs-caption); line-height: 1.4;
  color: var(--fg-muted);
}
/* One band is not an observation about the file, it is the argument. The
   wash runs across BOTH cells and the row's own wash is switched off, so
   the unverified criterion and the sentence about it are one ochre band
   crossing the whole sheet rather than two tinted rectangles that nearly
   line up. */
.v3 .band--wait { background: var(--fg-wait-tint); }
.v3 .anote--wait { border-left-color: var(--fg-wait-light); }
.v3 .anote--wait p { color: var(--fg-wait-d); font-weight: 600; }
.v3 .band--wait .row--wait { background: none; margin: 0; padding: 1px 0; border-bottom: 0; }

/* ══════════════════════════════════════════════════════════════════════
   T4 — THE BINDER OPENS
   The binder, made to work. The rail keeps its four tabs; the open one
   swells to take whatever height the sheet has spare, and the sentence
   about the artifact lives in that swell. So the takeaway is not under
   the slide, it is inside the thing it is about, and it moves when you
   click. Nothing on this slide is a full-width band.

   TITLE: kicker over h1, top left, with the loop locator opposite —
   the deck's own masthead from slide 28, unchanged. The slide is called
   "The four artifacts" because that is now what it is; the file name is
   on the card, where the click put it.

   The swell is a SEPARATE CELL, not content inside the button. Four
   sentences of prose inside a control would be read out as the control's
   name, and a tab called "spec.md what and why Not a word about Redis,
   middleware, or which function changes…" is not a tab.
   ══════════════════════════════════════════════════════════════════════ */
.v4 { --src-fs: clamp(15px, 1.95vh, 22px); }
.v4 .body {
  display: grid; align-items: stretch;
  grid-template-columns: minmax(232px, 0.31fr) minmax(0, 1fr);
}
.v4 .rail { row-gap: 3px; padding-right: 1px; }   /* rows set inline */
.v4 .tab {
  padding: var(--ae-space-3) var(--ae-space-4);
  border-radius: var(--ae-radius-lg) 0 0 var(--ae-radius-lg);
  background: var(--ae-cool-gray-100);
  border: 1px solid var(--fg-hair); border-right: 0;
}
.v4 .tab:hover { background: var(--fg-card); }
.v4 .tab .f {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--ae-font-mono); font-size: var(--ae-fs-caption);
  line-height: 1.2; font-weight: 600; color: var(--fg-muted);
  overflow-wrap: anywhere;
}
.v4 .tab .q {
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.25; color: var(--fg-faint);
}
.v4 .tab--on {
  background: var(--fg-card);
  box-shadow: inset 5px 0 0 var(--hue), var(--fg-d1);
  border-bottom: 0; border-radius: var(--ae-radius-lg) 0 0 0;
  margin-right: -1px; z-index: 1;
  padding-left: calc(var(--ae-space-4) + 5px);
  justify-content: flex-start;
}
.v4 .tab--on .f {
  font-size: var(--ae-fs-h3); line-height: var(--ae-lh-h3);
  font-weight: 700; color: var(--fg-ink); letter-spacing: -0.01em;
}
.v4 .tab--on .q { font-size: var(--ae-fs-body); line-height: 1.25; color: var(--fg-ink); }
/* The swell. -3px cancels the rail's row gap so card and swell are one
   white shape; the shadow and the hue edge are repeated, not inherited,
   because they are drawn per box. */
/* The note sits at the FOOT of the swell, not the head of it. Anchored
   at the top it left a pool of blank card under it and the open tab read
   as unfinished; anchored at the foot the blank is between the question
   and the note, and the card reads as a page with a footnote. */
.v4 .tkcell {
  display: flex; flex-direction: column; justify-content: flex-end;
  margin-top: -3px; margin-right: -1px; z-index: 1;
  background: var(--fg-card);
  border: 1px solid var(--fg-hair); border-right: 0; border-top: 0;
  border-radius: 0 0 0 var(--ae-radius-lg);
  box-shadow: inset 5px 0 0 var(--hue), var(--fg-d1);
  padding: 0 var(--ae-space-4) var(--ae-space-3) calc(var(--ae-space-4) + 5px);
  min-height: 0; overflow: hidden;
}
.v4 .tkcell .tk {
  padding-top: var(--ae-space-3); border-top: 1px solid var(--fg-hair);
}
.v4 .sheet { border-radius: 0 var(--ae-radius-lg) var(--ae-radius-lg) 0; }
.v4 .src {
  flex: 1; min-height: 0;
  display: grid; align-content: stretch; align-items: start;
  row-gap: var(--ae-space-3);
  padding: var(--ae-space-4) var(--ae-space-5);
}
.v4 .src .fill { display: block; }

/* ══════════════════════════════════════════════════════════════════════
   T5 — THE INDEX
   The other reading of the same set: not four tabs but a numbered
   contents list, because the four artifacts are a SEQUENCE and a tab
   stack does not say so. 1·2·3·4 down the left, hairline between, and
   the open one lifts off the list as a white card. Flat row versus
   raised card is a much louder state change than tab versus tab, and it
   costs no colour at all.

   TITLE: in the rail head, above the list, so the slide has no header
   band across the top and the sheet gets the whole height — the tallest
   document area of the three. The loop locator sits under the title,
   where it reads as part of the masthead rather than as a legend.

   TAKEAWAY: the sheet's footer well, same fill as its top bar, so the
   document is bracketed top and bottom by its own chrome and the
   sentence reads as the file's last line rather than as a slide caption.
   On verification.md the verdict legend and the takeaway stack in that
   one well, divided by a hairline.
   ══════════════════════════════════════════════════════════════════════ */
.v5 { --src-fs: clamp(15px, 2.0vh, 22px); }
.v5 .body {
  display: grid; align-items: stretch;
  grid-template-columns: minmax(250px, 0.32fr) minmax(0, 1fr);
  gap: var(--ae-space-5);
}
.v5 .mast { display: flex; flex-direction: column; min-height: 0; }
.v5 .mast h1 { margin: 0 0 var(--ae-space-3); }
/* The list runs the height of the document beside it. At min-content
   rows it ended two-fifths down the column with a field of blank paper
   under it, which read as a list that had lost its last six entries. */
.v5 .rail {
  flex: 1; margin-top: var(--ae-space-4); align-content: stretch;
  grid-auto-rows: minmax(min-content, 1fr);
}
/* justify-content on the shared .tab means "centre the stack of lines".
   Here the stack is a ROW, so the same declaration centred every entry
   horizontally and the numerals stepped left as the file names got
   longer — a contents list with no left edge. Restated, not inherited. */
/* A grid, not a flex row: the numeral has to sit on the file name's
   first baseline AND the pair has to sit in the middle of a tall row.
   align-items handles the first, align-content the second, and a flex
   row cannot do both at once. */
.v5 .tab {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  align-content: start; align-items: baseline;
  column-gap: var(--ae-space-3);
  padding: var(--ae-space-3) var(--ae-space-2);
  background: transparent; border: 0; border-top: 1px solid var(--fg-hair);
  border-radius: var(--ae-radius);
}
.v5 .tab:last-of-type { border-bottom: 1px solid var(--fg-hair); }
.v5 .tab:hover { background: var(--ae-cool-gray-100); }
.v5 .tab .n {
  flex: none; font-family: var(--ae-font-mono); font-weight: 700;
  font-variant-numeric: tabular-nums; font-size: var(--ae-fs-caption);
  line-height: 1.2; color: var(--fg-faint);
}
.v5 .tab .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.v5 .tab .f {
  font-family: var(--ae-font-mono); font-size: var(--ae-fs-caption);
  line-height: 1.2; font-weight: 600; color: var(--fg-muted);
  overflow-wrap: anywhere;
}
.v5 .tab .q {
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.25; color: var(--fg-faint);
}
/* Lifted out of the list: white, raised, hue-edged, and pulled into the
   gutter on both sides so it is visibly no longer flush with the rows
   above and below it. */
/* An entry sits directly under its own rule; the blank falls below it,
   which is what leading in a contents list looks like. The open one is
   the exception — it is a card, so it centres in its band. */
.v5 .tab--on {
  align-content: center;
  background: var(--fg-card);
  box-shadow: inset 5px 0 0 var(--hue), var(--fg-d2);
  border-top-color: transparent;
  margin: 0 calc(-1 * var(--ae-space-3));
  padding: var(--ae-space-4) var(--ae-space-4) var(--ae-space-4) calc(var(--ae-space-4) + 5px);
}
.v5 .tab--on .n { color: var(--hue-d); }
.v5 .tab--on .f {
  font-size: var(--ae-fs-h4); line-height: var(--ae-lh-h4);
  font-weight: 700; color: var(--fg-ink); letter-spacing: -0.01em;
}
.v5 .tab--on .q { font-size: var(--ae-fs-small); line-height: 1.3; color: var(--fg-ink); }
.v5 .src {
  flex: 1; min-height: 0;
  display: grid; align-content: stretch; align-items: start;
  row-gap: var(--ae-space-3);
  padding: var(--ae-space-4) var(--ae-space-5);
}
.v5 .src .fill { display: block; }
.v5 .tkbar {
  flex: none;
  padding: var(--ae-space-3) var(--ae-space-5);
  padding-left: calc(var(--ae-space-5) + 1.15em);
  background: var(--ae-cool-gray-100);
  border-top: 1px solid var(--fg-hair);
}

/* ══════════════════════════════════════════════════════════════════════
   T6 — THE MARGIN NOTE
   The takeaway stops being a summary and becomes an annotation: one
   note, in a margin, bracketed to the exact band of the document that
   earns it. On spec.md it stands beside the acceptance criteria, on
   plan.md beside the approach, on tasks.md beside the four checked
   lines, and on verification.md beside the one ochre row — which is the
   only placement in this file where the deck's sharpest claim is
   pointed AT rather than restated underneath.

   The bracket is a 3px ink rule thickening the margin rule for exactly
   the height of that band. Ink, and only there: it survives greyscale
   with no hue to lose, and it never competes with the ochre wash it
   sits next to.

   TITLE: one line, and it names what is open — "The four artifacts —
   spec.md". So the title is also the answer to "which one am I looking
   at", and a click visibly changes the heading, which is what tells a
   first-time reader the rail did something.

   The margin is EMPTY on the other bands. That is what a margin looks
   like; filling it was treatment 3, and treatment 3 is still in the file
   for anyone who wants that instead.
   ══════════════════════════════════════════════════════════════════════ */
.v6 { --src-fs: clamp(15px, 1.95vh, 21px); }
/* Three columns compete for 1280px here — rail, document, margin — and
   the document is the one that must not lose. At 0.2fr rail and 0.3fr
   margin the German verification table wrapped two extra rows and the
   grid drew 19px past its own bottom edge into the verdict legend. The
   rail and the margin each give back a little; both are sized by their
   longest line, not by proportion. */
.v6 .body {
  display: grid; align-items: stretch;
  grid-template-columns: minmax(176px, 0.185fr) minmax(0, 1fr);
}
.v6 .rail {
  grid-template-rows: repeat(4, minmax(min-content, 1fr));
  row-gap: 3px; padding-right: 1px;
}
.v6 .tab {
  padding: var(--ae-space-3) var(--ae-space-4);
  border-radius: var(--ae-radius-lg) 0 0 var(--ae-radius-lg);
  background: var(--ae-cool-gray-100);
  border: 1px solid var(--fg-hair); border-right: 0;
}
.v6 .tab:hover { background: var(--fg-card); }
.v6 .tab .f {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--ae-font-mono); font-size: var(--ae-fs-caption);
  line-height: 1.2; font-weight: 600; color: var(--fg-muted);
  overflow-wrap: anywhere;
}
.v6 .tab .q {
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.25; color: var(--fg-faint);
}
.v6 .tab--on {
  background: var(--fg-card);
  box-shadow: inset 5px 0 0 var(--hue), var(--fg-d1);
  margin-right: -1px; z-index: 1;
  padding-left: calc(var(--ae-space-4) + 5px);
}
.v6 .tab--on .f {
  font-size: var(--ae-fs-h4); line-height: var(--ae-lh-h4);
  font-weight: 700; color: var(--fg-ink); letter-spacing: -0.01em;
}
.v6 .tab--on .q { font-size: var(--ae-fs-small); line-height: 1.25; color: var(--fg-ink); }
.v6 .sheet { border-radius: 0 var(--ae-radius-lg) var(--ae-radius-lg) 0; }
.v6 .ann {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.28fr);
  align-content: stretch;
}
.v6 .acell { padding: 3px var(--ae-space-4); display: flex; flex-direction: column; justify-content: safe center; }
.v6 .asrc > .src { width: 100%; }
.v6 .src { line-height: 1.42; }
.v6 .ln + .ln { margin-top: 0; }
.v6 .h { margin-top: 0.34em; }
.v6 .row { padding: 1px 0; gap: var(--ae-space-2); }
.v6 .row--wait { padding: 1px var(--ae-space-4); margin: 0 calc(-1 * var(--ae-space-4)); }
.v6 .gap { height: 0.25em; }
.v6 .amar { background: var(--fg-paper); border-left: 1px solid var(--fg-hair); position: relative; }
/* The bracket. A 3px ink rule where the hairline runs, for the height of
   one band. Drawn with a box-shadow rather than a wider border so the
   margin's text does not shift by 2px on the annotated row. */
/* z-index, because the note is now out of flow and the margin cells
   below it are opaque. Without it the cell for the next band paints
   straight over the bottom third of the sentence — nothing overflows,
   nothing clips, the words are simply not there. */
.v6 .amar--on { box-shadow: inset 3px 0 0 var(--fg-ink); z-index: 2; }
/* THE NOTE FLOATS; THE BRACKET POINTS. In flow, the note was the tallest
   thing in its grid row, so the row grew to hold it — and on
   verification.md that row is a SINGLE TABLE LINE, which meant a
   four-line note forced a one-line band to 180px and shoved the rest of
   the document out through the bottom of the sheet and into the verdict
   legend. Taking the note out of flow separates the two jobs: the
   bracket keeps the exact height of the band it marks, and the note
   centres on it using space the empty margin has anyway. */
.v6 .amar .tk { margin: 0; }
.v6 .amar--on .tk {
  position: absolute; top: 50%; transform: translateY(-50%);
  left: calc(var(--ae-space-4) + 3px); right: var(--ae-space-4);
  color: var(--fg-ink);
}

/* ══════════════════════════════════════════════════════════════════════
   SHARED — THE INDEX FAMILY  (treatments 7, 8 and 9)

   Treatment 5 was the shape the user wanted and the card was the thing
   they rejected. Four complaints, and the first one is the one that
   matters:

   1. THE LABEL MOVED. A closed entry in 5 sat at the top of its band
      (align-content:start) and the open one centred in it, and the file
      name grew from 14px to 17px at the same moment. So a click did not
      open a card, it TELEPORTED the word you had just clicked. Here the
      geometry is a promise: every card in 7, 8 and 9 keeps the same
      padding, the same type sizes and the same vertical anchor in both
      states. Nothing about the label is a function of whether the card
      is open — not its size, not its position, not its leading.

      WHERE A CARD DOES GROW, IT GROWS OUTWARD. The open card takes a
      negative margin and adds exactly that much padding back, so the
      border box swells while the content box stays where it was, to the
      pixel. That is the whole trick, and it is why "bigger" and "did not
      move" are not in conflict here.

      What is left to say "open" is therefore FILL, EDGE, DEPTH and
      WEIGHT — four cues, three of which survive greyscale.

   2. THE HUE WAS A LEFT BORDER. An inset 5px shadow in var(--hue), on the open
      card only: the colour appeared on click, sat on one edge, and said
      nothing about the other three artifacts. Each treatment below
      carries the chapter hue a different way, and in all three EVERY
      card carries its own step's hue at rest, not just the open one —
      which is what "the card represents its step" actually asks for.

   3. THE SHEET WAS PLAIN. Three different typesettings of the same
      markdown below; see each treatment's own note.

   4. TOO BIG. The source drops from clamp(15px, 2.0vh, 22px) to
      clamp(14px, 1.78vh, 19px), leading from 1.5 to 1.45, and the
      sheet's padding from space-4/space-5 to space-3/space-4. 14px is
      the deck's floor and this sits ON it, not under it — the shipped
      device's 12.9px frontmatter is what that rule exists to stop.
   ══════════════════════════════════════════════════════════════════════ */
.ix { --src-fs: clamp(14px, 1.78vh, 19px); }
.ix .body {
  display: grid; align-items: stretch;
  grid-template-columns: minmax(240px, 0.30fr) minmax(0, 1fr);
  gap: var(--ae-space-5);
}
.ix .mast { display: flex; flex-direction: column; min-height: 0; }
.ix .mast h1 { margin: 0 0 var(--ae-space-2); }
.ix .rail { flex: 1; margin-top: var(--ae-space-4); }

/* The card, before any treatment styles it. A grid rather than a flex
   row: the numeral has to sit against the label AND the pair has to sit
   at a fixed place in the band, and a flex row cannot do both. */
.ix .tab {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  align-content: center; align-items: center;
  column-gap: var(--ae-space-3);
  background: transparent; border: 1px solid transparent;
}
.ix .tab .n {
  font-family: var(--ae-font-mono); font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-size: var(--ae-fs-caption); line-height: 1.2; color: var(--fg-faint);
}
.ix .tab .txt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
/* Both lines are set at the floor and STAY there when the card opens.
   This is the constraint the whole family is built around. */
.ix .tab .f {
  font-family: var(--ae-font-mono); font-size: var(--ae-fs-caption);
  line-height: 1.25; font-weight: 600; color: var(--fg-muted);
  overflow-wrap: anywhere;
}
.ix .tab .q {
  font-family: var(--ae-font); font-size: var(--ae-fs-caption);
  line-height: 1.3; color: var(--fg-faint);
}
.ix .tab--on .f { color: var(--fg-ink); font-weight: 700; }
.ix .tab--on .q { color: var(--fg-ink); }

/* ── the sheet, tightened ──────────────────────────────────────────── */
.ix .sheet__bar { padding: 5px var(--ae-space-4); }
.ix .path .dir { color: var(--fg-faint); }
.ix .fm { padding: 6px var(--ae-space-4); line-height: 1.3; }
.ix .src {
  flex: 1; min-height: 0;
  display: grid; align-content: stretch; align-items: start;
  row-gap: var(--ae-space-3);
  padding: var(--ae-space-3) var(--ae-space-4);
  line-height: 1.45;
}
.ix .src .fill { display: block; }
.ix .ln + .ln { margin-top: 0; }
.ix .h { margin-top: 0.5em; }
.ix .key { padding: 5px var(--ae-space-4); }
.ix .row { padding: 2px 0; }
.ix .row--wait { padding: 2px var(--ae-space-4); margin: 0 calc(-1 * var(--ae-space-4)); }
/* A hanging indent that actually hangs. The shared rule indents wrapped
   lines by 1.5em whatever the marker is, so a wrapped checkbox item used
   to land 2.1em short of the text it continues. The indent is now the
   width of the marker it is hanging: "- " is 1.2em, "- [x] " is 3.6em. */
.ix .li { padding-left: 1.2em; text-indent: -1.2em; }
.ix .done, .ix .todo { padding-left: 3.6em; text-indent: -3.6em; }
.ix .tk--foot {
  flex: none;
  padding: var(--ae-space-3) var(--ae-space-4);
  padding-left: calc(var(--ae-space-4) + 1.15em);
}

/* ══════════════════════════════════════════════════════════════════════
   T7 — THE LEDGER
   CARD: none, until you open one. Four entries on a ruled column, the
   way a contents list is set. The open entry lifts off the rules as a
   white card that BLEEDS OUTWARD past them — same padding plus the same
   margin, so it grows 18px taller and 22px wider around a label that has
   not moved a pixel.

   HUE: the numeral. Every entry carries a ring in its step's colour, so
   the four steps are legible before any click; opening one FILLS the
   ring and flips the numeral to white. Hollow versus filled is the exact
   form cue the palette note names, and it is the one that survives
   greyscale best — a white disc and a near-black disc are six stops
   apart with no hue involved at all.

   SHEET: sections are RULED. Every "##" gets a hairline under it running
   the width of the measure, so the document reads as a set of banded
   sections rather than as a wall of mono. The frontmatter becomes a
   four-column grid on the white page, fenced above by the path bar's own
   rule and below by its own — the "---" of a real frontmatter block,
   drawn instead of spelled, because spelling it costs two lines of type
   at the floor size and buys nothing.
   ══════════════════════════════════════════════════════════════════════ */
/* 9px of padding, because the open card bleeds 9px. Without it the card
   for the LAST artifact hangs 9px below the rail — which is also the
   bottom of the sheet beside it — and the slide ends on a card that is
   lower than everything else on it by exactly the amount it grew. */
.v7 .rail {
  align-content: stretch; grid-auto-rows: minmax(min-content, 1fr);
  padding: 9px 0; margin-top: calc(var(--ae-space-4) - 9px);
}
.v7 .tab {
  padding: var(--ae-space-3) var(--ae-space-2);
  border-top-color: var(--fg-hair);
  border-radius: var(--ae-radius);
}
.v7 .tab:last-of-type { border-bottom-color: var(--fg-hair); }
.v7 .tab:hover { background: var(--ae-cool-gray-100); }
.v7 .tab .n {
  width: 1.75em; height: 1.75em; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--hue); color: var(--hue-d); background: transparent;
}
/* The bleed. -9/-11 of margin, +9/+11 of padding: the border box grows,
   the content box does not move. The border stays 1px and only loses its
   colour, because dropping it to 0 would shift the label by that pixel. */
.v7 .tab--on {
  margin: -9px -11px;
  padding: calc(var(--ae-space-3) + 9px) calc(var(--ae-space-2) + 11px);
  background: var(--fg-card);
  border-color: transparent;
  box-shadow: var(--fg-d2);
  z-index: 1;
}
.v7 .tab--on .n { background: var(--hue); border-color: var(--hue); color: #fff; }
.v7 .fm {
  background: var(--fg-card);
  display: grid; grid-template-columns: repeat(4, auto);
  justify-content: start; column-gap: var(--ae-space-5); row-gap: 0;
}
.v7 .h { border-bottom: 1px solid var(--fg-hair); padding-bottom: 2px; }
.v7 .tk--foot {
  background: var(--ae-cool-gray-100);
  border-top: 1px solid var(--fg-hair);
}

/* ══════════════════════════════════════════════════════════════════════
   T8 — THE DOCK
   CARD: a tab with a squared inner edge. The three closed ones stand off
   the sheet by a gutter; the open one reaches across it and overlaps the
   sheet's own border by a pixel, so card and document are one shape.
   Only the RIGHT edge moves — the label's left padding is identical in
   both states, so the text cannot move even in principle.

   HUE: the ground. Every card is filled with its step's tint at rest, so
   the rail is four coloured chips and the two Plan artifacts group
   without a word. Opening one drains it to white — and the tint appears
   at the top of the sheet instead, as if the card's colour had poured
   into the document it opened. Colour never leaves the slide; it moves.
   The form cue is the docking, plus white-versus-tint and the depth.

   SHEET: the chrome does LESS. One band only — the path — and it is the
   band carrying the hue. Frontmatter, verdict legend and takeaway are
   plain text on the page, divided by hairlines. The markdown markers
   hang in a left margin so every line of text, heading and prose and
   list alike, sits on ONE left edge. That is what a set page looks like
   and it is invisible until you see it next to the alternative.
   ══════════════════════════════════════════════════════════════════════ */
.v8 .body { grid-template-columns: minmax(236px, 0.29fr) minmax(0, 1fr); gap: 0; }
.v8 .rail { align-content: stretch; grid-auto-rows: minmax(min-content, 1fr); row-gap: 4px; }
.v8 .tab {
  padding: var(--ae-space-3) var(--ae-space-4);
  margin-right: var(--ae-space-5);
  background: var(--hue-tint);
  border-color: var(--fg-hair);
  border-radius: var(--ae-radius) 0 0 var(--ae-radius);
}
.v8 .tab:hover { border-color: var(--fg-muted); }
.v8 .tab--on {
  margin-right: -1px;
  background: var(--fg-card);
  border-right-color: var(--fg-card);
  box-shadow: var(--fg-d2);
  z-index: 2;
}
.v8 .sheet { border-radius: 0 var(--ae-radius-lg) var(--ae-radius-lg) 0; }
.v8 .sheet__bar { background: var(--hue-tint); }
.v8 .fm {
  background: transparent;
  gap: 1px var(--ae-space-2);
}
.v8 .fm span:not(:last-child)::after { content: ' \00b7'; color: var(--ae-cool-gray-300); }
.v8 .key { background: transparent; }
.v8 .tk--foot { border-top: 1px solid var(--fg-hair); }
/* The margin. 1.9em of it, and the marker sits in a box of its own so
   "#" and "##" both start at its left edge and the words after them both
   land on zero. A plain negative margin cannot do this: it moves the
   marker AND the text, so a one-hash heading would sit 0.6em left of a
   two-hash one and the edge the whole idea depends on would be ragged. */
.v8 .src { padding-left: calc(var(--ae-space-4) + 1.9em); }
.v8 .h { margin-top: 0.75em; }
.v8 .h .mk { display: inline-block; width: 1.3em; margin-left: -1.9em; }
.v8 .li { padding-left: 0; text-indent: 0; }
.v8 .li .mk { display: inline-block; width: 0.6em; margin-left: -1.2em; }
/* The wash still has to reach the sheet's inner edge, and the sheet's
   inner edge is further away on this treatment than on any other. */
.v8 .row--wait {
  margin-left: calc(-1 * (var(--ae-space-4) + 1.9em));
  padding-left: calc(var(--ae-space-4) + 1.9em);
}

/* ══════════════════════════════════════════════════════════════════════
   T9 — THE STACK
   CARD: four separate blocks with air between them, each capped by a
   3px rule in its step's colour. Nothing on the left edge at all — the
   colour is a HEADER on the card, the way a tab divider is coloured at
   its top rather than down its spine. Opening one washes the block in
   the same hue at tint strength and doubles the cap to 6px, drawn with
   an inset shadow rather than a thicker border so that the label does
   not move by the 3px a border change would cost. It also widens by
   10px each side, on the same margin-plus-padding trick.

   COMPACTION: this is the compact one. The four cards take the height
   they need and no more, and the space that treatment 5 left blank under
   its list is where the artifact's sentence now lives — so the left
   column reads top to bottom as title, contents, and the point of the
   thing you have open.

   SHEET: the chrome does MORE. Path and frontmatter share one well in
   the open artifact's tint, closed off from the page by a 2px rule in
   the full hue — so the document is visibly headed by the same colour as
   the card that opened it. Section headings are followed by a rule that
   runs out to the measure, which is the oldest way of setting a heading
   inside a body of type and costs no vertical space at all.
   ══════════════════════════════════════════════════════════════════════ */
.v9 .body { grid-template-columns: minmax(252px, 0.315fr) minmax(0, 1fr); }
.v9 .rail {
  flex: none; align-content: start;
  grid-auto-rows: min-content; row-gap: var(--ae-space-4);
}
.v9 .tab {
  padding: var(--ae-space-3);
  background: var(--fg-card);
  border-color: var(--fg-hair);
  border-top: 3px solid var(--hue);
  border-radius: 2px 2px var(--ae-radius) var(--ae-radius);
}
.v9 .tab:hover { border-color: var(--fg-muted); border-top-color: var(--hue); }
.v9 .tab--on {
  margin: 0 -10px;
  padding: var(--ae-space-3) calc(var(--ae-space-3) + 10px);
  background: var(--hue-tint);
  box-shadow: inset 0 3px 0 var(--hue), var(--fg-d2);
  z-index: 1;
}
.v9 .tab--on .n { color: var(--hue-d); }
/* The sentence takes the column's remaining height, under a rule. It is
   the only thing on the slide that is not a document or a control, so it
   gets the one place that is neither. */
/* Anchored to the FOOT of the column, not floated under the list. Under
   the list it left the left column ending two-thirds down a full-height
   slide, which is the exact complaint treatment 5's rail earned. At the
   foot the column is pinned top and bottom and the air is between the
   contents and its footnote, where air belongs. The rail keeps a margin
   of its own so a long German sentence cannot push its rule up against
   the last card. */
.v9 .rail { margin-bottom: var(--ae-space-5); }
.v9 .tk--mar {
  flex: none; margin-top: auto;
  padding-top: var(--ae-space-3);
  border-top: 1px solid var(--fg-hair);
}
.v9 .sheet__bar { background: var(--hue-tint); border-bottom: 0; }
.v9 .fm { background: var(--hue-tint); border-bottom: 2px solid var(--hue); }
.v9 .h { display: flex; align-items: center; gap: 0.55em; }
.v9 .h::after { content: ''; flex: 1 1 auto; height: 1px; background: var(--fg-hair); }

/* Four aligned columns of frontmatter need roughly 740px of sheet, and
   below about 1180px of viewport they stop having it — "feature:
   0002-rate-limiting" starts breaking mid-token and the block reads as
   damaged rather than as dense. Two columns and four rows costs ~36px of
   height, which every treatment here has to spare. */
@media (max-width: 1180px) {
  .v7 .fm { grid-template-columns: repeat(2, auto); }
}

@media (max-width: 900px) {
  .v2 .body { grid-template-columns: 1fr; }
  .v2 .rail { grid-template-rows: none; }
  .v2 .sheet { border-radius: var(--ae-radius-lg); }
  .v3 .ann { grid-template-columns: 1fr; }
  .v3 .anote { border-left: 0; border-top: 1px solid var(--fg-hair); }
  .v4 .body, .v5 .body, .v6 .body, .ix .body { grid-template-columns: 1fr; }
  .v4 .rail, .v6 .rail { grid-template-rows: none !important; }
  .v4 .sheet, .v6 .sheet, .v8 .sheet { border-radius: var(--ae-radius-lg); }
  .ix .rail { grid-auto-rows: min-content; }
  .v8 .tab, .v8 .tab--on { margin-right: 0; border-radius: var(--ae-radius); }
  .v7 .fm { grid-template-columns: repeat(2, auto); }
  .v6 .ann { grid-template-columns: 1fr; }
  .v6 .amar { border-left: 0; border-top: 1px solid var(--fg-hair); }
  .row { grid-template-columns: 1fr; gap: 0; }
  .row span:last-child { text-align: left; }
}

          { row: ['Pro API-Key, nicht pro IP', 'Test: zwei Keys eine IP, beide bedient; ein Key zwei IPs, zweiter abgelehnt', 'bestanden'], v: 'pass' },

          { gap: true },

        ],
        notes: [
