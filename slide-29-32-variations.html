      },
    },
  },
};

var SUB = {
  v1: '<b>1 · Page</b> — four slides. The sheet takes the frame, the crumb moves into its tab bar. Click the crumb to walk the four.',
  v2: '<b>2 · Binder</b> — four slides. Four tabs down the rail, and the open one is the title. Click a tab to walk the four.',
  v3: '<b>3 · Margin</b> — four slides. A note beside every section, aligned by grid row. Click the crumb to walk the four.',
  v4: '<b>4 · The binder opens</b> — one slide. The open card swells and holds the takeaway; kicker and h1 above, nothing across the bottom.',
  v5: '<b>5 · The index</b> — one slide. A numbered contents list, the open one lifted out as a card; title in the rail head, takeaway in the sheet’s footer.',
  v6: '<b>6 · The margin note</b> — one slide. The title names what is open; the takeaway is bracketed to the band of the document that earns it.',
  v7: '<b>7 · The ledger</b> — 5, re-cut. Ruled contents column, hue in the numeral (hollow ring → filled disc), open entry bleeds outward as a card. Sheet: ruled sections, frontmatter in a fenced four-column grid.',
  v8: '<b>8 · The dock</b> — 5, re-cut. Each card filled with its step’s tint; the open one drains to white, reaches across the gutter and joins the sheet, whose path bar takes the tint instead. Sheet: no bands, markers hanging in a left margin.',
  v9: '<b>9 · The stack</b> — 5, re-cut, and the compact one. Four blocks capped by a 3px hue rule, the open one hue-washed with a doubled cap; the takeaway fills the column under the list. Sheet: tinted header well, headings ruled out to the measure.',
};

/* Which band of each document the takeaway is ABOUT — treatment 6 only.
   Indexes into SECS[art], not into doc[], so it moves with the bands and
   cannot drift when a section is re-cut. Verification points at band 1,
   which is the single ochre row: the one place in this file where the
   claim and the sentence about the claim are side by side. */
var TKBAND = { spec: 2, plan: 0, tasks: 1, verification: 1 };

/* ── pieces ─────────────────────────────────────────────────────────── */

function h1of(d) {
  return d.file + ' — <span class="fg-mark fg-mark--sweep">' + d.title + '</span>';
}

function loc(t, art) {
  return '<div class="loc">' + t.loop.map(function (s, i) {
    return (i ? '<i class="sep"></i>' : '')
      + '<span class="dot' + (i === STEP[art] ? ' on' : '') + '">' + s + '</span>';
  }).join('') + '</div>';
}

function crumb(t, art) {
  return '<div class="crumb" role="tablist" aria-label="' + t.railLabel + '">' + ORDER.map(function (a, i) {
    var on = a === art;
    return (i ? '<span class="sep" aria-hidden="true">→</span>' : '')
      + '<button type="button" role="tab" id="tab-' + a + '" class="seg' + (on ? ' seg--on' : '') + '"'
      + ' data-art="' + a + '" aria-selected="' + on + '" aria-controls="sheet"'
      + ' tabindex="' + (on ? '0' : '-1') + '">' + a + '</button>';
  }).join('') + '</div>';
}

/* The sheet is the tab panel the rail and the crumb both control. It is
   focusable so a keyboard user can reach the document itself after
   choosing it, which is the whole point of the interaction. */
function sheet(art, inner) {
  return '<div class="sheet" id="sheet" role="tabpanel" tabindex="0"'
    + ' aria-labelledby="tab-' + art + '">' + inner + '</div>';
}

/* ── the rail: four cards, four real buttons ────────────────────────────
   One builder for treatments 4, 5 and 6. They differ in what a card
   shows and how the open one is drawn, never in what it IS: a button in
   a tablist, with roving tabindex, that renders the document it names.

   "extra" lets treatment 4 hang its swell off the open card. It is a
   presentational sibling rather than button content, so the card's
   accessible name stays "spec.md, what and why". */
function rail(t, art, opt) {
  var kids = ORDER.map(function (a, i) {
    var dd = t.docs[a];
    var on = a === art;
    var num = opt.numbered ? '<span class="n" aria-hidden="true">' + (i + 1) + '</span>' : '';
    var inner = '<span class="f"><span>' + dd.file + '</span>'
        + (on ? '' : '<i class="go" aria-hidden="true">›</i>') + '</span>'
      + '<span class="q">'
        + (on && opt.mark ? '<span class="fg-mark fg-mark--sweep">' + dd.title + '</span>' : dd.title)
      + '</span>';
    /* EVERY card carries its own step's hue class, not just the open
       one. Treatments 7, 8 and 9 all colour the closed cards too — a
       rail where only the open card has a colour is a rail that cannot
       say the four artifacts belong to three different steps. */
    return '<button type="button" role="tab" id="tab-' + a + '"'
      + ' class="tab ' + HUECLS[STEP[a]] + (on ? ' tab--on' : '') + ' fg-in"'
      + ' style="--fg-at:' + (1 + i) + '"'
      + ' data-art="' + a + '" aria-selected="' + on + '" aria-controls="sheet"'
      + ' tabindex="' + (on ? '0' : '-1') + '">'
      + num + (opt.numbered ? '<span class="txt">' + inner + '</span>' : inner)
      + '</button>'
      + (on && opt.extra ? opt.extra : '');
  }).join('');
  return '<div class="rail ' + HUECLS[STEP[art]] + '" role="tablist" aria-orientation="vertical"'
    + ' aria-label="' + t.railLabel + '"'
    + (opt.rows ? ' style="grid-template-rows:' + opt.rows + '"' : '')
    + '>' + kids + '</div>';
}

/* The slide masthead: the deck's own kicker-over-h1 from slide 28. */
function mast(t, extra) {
  return '<p class="kicker fg-in" style="--fg-at:1">' + t.kicker + '</p>'
    + '<h1 class="fg-in" style="--fg-at:1">' + t.title + (extra || '') + '</h1>';
}

function takeaway(d, cls, at) {
  return '<span class="tk ' + cls + ' fg-in" style="--fg-at:' + at + '">'
    + d.caption + '</span>';
}

/* The directory is wrapped so a treatment can push it back behind the
   file name without touching the string. It is one path either way. */
function bar(art, right, cls) {
  return '<div class="sheet__bar ' + (cls || '') + ' fg-in" style="--fg-at:3">'
    + '<span class="path"><span class="dir">' + DIR + '</span><b>' + art + '.md</b></span>'
    + (right || '')
  + '</div>';
}

function fm(art) {
  return '<div class="fm fg-in" style="--fg-at:3">' + FM[art].map(function (f) {
    var i = f.indexOf(': ');
    return '<span><span class="k">' + f.slice(0, i + 1) + '</span> ' + f.slice(i + 2) + '</span>';
  }).join('') + '</div>';
}

function srcLine(r) {
  if (r.h) {
    var i = r.h.indexOf(' ');
    return '<div class="ln h"><span class="mk">' + r.h.slice(0, i) + '</span> <b>' + r.h.slice(i + 1) + '</b></div>';
  }
  if (r.li)   return '<div class="ln li"><span class="mk">-</span> ' + r.li + '</div>';
  if (r.done) return '<div class="ln done"><span class="mk">- [x]</span> ' + r.done + '</div>';
  if (r.todo) return '<div class="ln todo"><span class="mk">- [ ]</span> ' + r.todo + '</div>';
  if (r.gap)  return '<div class="ln gap"></div>';
  if (r.row) {
    var cells = r.row.map(function (c, i) {
      if (r.head || i < 2) return '<span>' + c + '</span>';
      return '<span><span class="v v--' + r.v + '">' + c + '</span></span>';
    }).join('');
    return '<div class="ln row' + (r.head ? ' row--head' : '')
      + (r.v === 'wait' ? ' row--wait' : '') + '">' + cells + '</div>';
  }
  return '<div class="ln p">' + r.p + '</div>';
}

/* A document, cut into its bands. Returns an array of HTML strings, one
   per band, so T1 can stretch between them and T3 can put a note beside
   each one. */
function bands(d, art) {
  return SECS[art].map(function (rg) {
    return d.doc.slice(rg[0], rg[1] + 1).map(srcLine).join('');
  });
}

function hasVerdicts(d) {
  return d.doc.some(function (r) { return r.v; });
}

function legend(t, d) {
  if (!hasVerdicts(d)) return '';
  return '<div class="key fg-in" style="--fg-at:10">'
    + '<span class="kl">' + t.keyLabel + '</span>'
    + t.key.map(function (k) {
        return '<span class="v v--' + k[0] + '">' + k[1] + '</span>';
      }).join('')
  + '</div>';
}

/* HOW MUCH OF THE LEFTOVER HEIGHT EACH GAP GETS. The rows stretch, which
   shares the slack equally between them — so a SHORT document is pulled
   apart, and tasks.md, three bands of one-line items in a 440px well,
   opened 65px between its title and its first task and read as if lines
   were missing. Trailing rows take a share as bottom margin instead: one
   for treatments 1–5, four for 7–9, which brings that gap to 45px and
   leaves the rest as blank page under the last line, where a short file
   in an editor puts it. */
function srcGrid(d, art, fills) {
  var tail = '';
  for (var i = 0; i < (fills || 1); i++) tail += '<i class="fill" aria-hidden="true"></i>';
  return '<div class="src">' + bands(d, art).map(function (s, i) {
    return '<div class="sec fg-in" style="--fg-at:' + (4 + Math.min(i, 6)) + '">' + s + '</div>';
  }).join('') + tail + '</div>';
}

function foot(d) {
  return '<div class="fg-wrap foot"><p class="fg-note fg-in" style="--fg-at:11"><span>'
    + d.caption + '</span></p></div>';
}

/* ── T1 · THE PAGE ──────────────────────────────────────────────────── */
function V1(t, art) {
  var d = t.docs[art];
  return ''
  + '<div class="fg-wrap head hrow">'
    + '<h1 class="fg-in" style="--fg-at:1">' + h1of(d) + '</h1>'
    + '<div class="fg-in" style="--fg-at:2">' + loc(t, art) + '</div>'
  + '</div>'
  + '<div class="fg-wrap body">'
    + sheet(art, bar(art, crumb(t, art)) + fm(art) + srcGrid(d, art) + legend(t, d))
  + '</div>'
  + foot(d);
}

/* ── T2 · THE BINDER ────────────────────────────────────────────────── */
function V2(t, art) {
  var d = t.docs[art];
  return ''
  + '<div class="fg-wrap body">'
    + '<div class="rail">'
      + ORDER.map(function (a, i) {
          var dd = t.docs[a];
          var on = a === art;
          /* Treatment 2's whole idea is that the open tab IS the slide
             title, so it has to stay an h1 — but a heading may not live
             inside a button, and the tab is a button now. The heading
             wraps the button and takes display:contents, which keeps the
             semantics and leaves the rail's grid rows untouched. */
          var btn = '<button type="button" id="tab-' + a + '" data-art="' + a + '" class="tab'
            + (on ? ' tab--on ' + HUECLS[STEP[a]] : '') + ' fg-in" style="--fg-at:' + (1 + i) + '">'
            + '<span class="f">' + dd.file + '</span>'
            + '<span class="q">'
              + (on ? '<span class="fg-mark fg-mark--sweep">' + dd.title + '</span>' : dd.title)
            + '</span>'
          + '</button>';
          return on ? '<h1 class="th">' + btn + '</h1>' : btn;
        }).join('')
    + '</div>'
    + sheet(art, bar(art, loc(t, art)) + fm(art) + srcGrid(d, art) + legend(t, d))
  + '</div>'
  + foot(d);
}

/* ── T3 · THE MARGIN ────────────────────────────────────────────────── */
function V3(t, art) {
  var d = t.docs[art];
  var bs = bands(d, art);
  var isWaitBand = function (i) {
    return art === 'verification' && SECS[art][i][0] === SECS[art][i][1]
      && d.doc[SECS[art][i][0]].v === 'wait';
  };
  return ''
  + '<div class="fg-wrap head hrow">'
    + '<h1 class="fg-in" style="--fg-at:1">' + h1of(d) + '</h1>'
    + '<div class="fg-in" style="--fg-at:2">' + loc(t, art) + '</div>'
  + '</div>'
  + '<div class="fg-wrap body">'
    + sheet(art, ''
      + bar(art, crumb(t, art)) + fm(art)
      + '<div class="ann">'
        + bs.map(function (s, i) {
            var b = i ? ' brd' : '';
            var w = isWaitBand(i) ? ' band--wait' : '';
            var at = 4 + Math.min(i, 6);
            return '<div class="acell asrc' + b + w + ' fg-in" style="--fg-at:' + at + '"><div class="src">' + s + '</div></div>'
              + '<div class="acell anote' + b + w + (isWaitBand(i) ? ' anote--wait' : '') + ' fg-in" style="--fg-at:' + at + '">'
                + (d.notes[i] ? '<p>' + d.notes[i] + '</p>' : '')
              + '</div>';
          }).join('')
      + '</div>'
      + legend(t, d))
  + '</div>'
  + foot(d);
}

/* ══════════════════════════════════════════════════════════════════════
   T4 · THE BINDER OPENS
   ══════════════════════════════════════════════════════════════════════ */
function V4(t, art) {
  var d = t.docs[art];
  /* The open card takes only the height it needs; the swell beneath it
     takes everything left over. Written as a rows string rather than as
     flex on the card because the swell is a sibling — a grid is the only
     thing here that can hand leftover height to a specific child. */
  var rows = [];
  ORDER.forEach(function (a) {
    rows.push('min-content');
    if (a === art) rows.push('1fr');
  });
  var swell = '<span class="tkcell ' + HUECLS[STEP[art]] + ' fg-in" role="presentation" style="--fg-at:5">'
    + takeaway(d, '', 5) + '</span>';
  return ''
  + '<div class="fg-wrap head hrow">'
    + '<div>' + mast(t) + '</div>'
    + '<div class="fg-in" style="--fg-at:2">' + loc(t, art) + '</div>'
  + '</div>'
  + '<div class="fg-wrap body">'
    /* No crumb in the sheet bar. The rail IS the crumb now — a second
       copy of the same control would be two things claiming to say where
       you are, and two elements claiming the same DOM id. */
    + rail(t, art, { rows: rows.join(' '), extra: swell, mark: true })
    + sheet(art, bar(art, '') + fm(art) + srcGrid(d, art) + legend(t, d))
  + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════
   T5 · THE INDEX
   ══════════════════════════════════════════════════════════════════════ */
function V5(t, art) {
  var d = t.docs[art];
  return ''
  + '<div class="fg-wrap body">'
    + '<div class="mast">'
      + mast(t)
      + '<div class="fg-in" style="--fg-at:2">' + loc(t, art) + '</div>'
      + rail(t, art, { numbered: true, mark: true })
    + '</div>'
    + sheet(art, bar(art, '') + fm(art) + srcGrid(d, art) + legend(t, d)
        + takeaway(d, 'tkbar', 11))
  + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════
   T6 · THE MARGIN NOTE
   ══════════════════════════════════════════════════════════════════════ */
function V6(t, art) {
  var d = t.docs[art];
  var bs = bands(d, art);
  var tkb = TKBAND[art];
  var isWaitBand = function (i) {
    return art === 'verification' && SECS[art][i][0] === SECS[art][i][1]
      && d.doc[SECS[art][i][0]].v === 'wait';
  };
  return ''
  + '<div class="fg-wrap head hrow">'
    + '<h1 class="fg-in" style="--fg-at:1">' + t.title
      + ' — <span class="fg-mark fg-mark--sweep">' + d.file + '</span></h1>'
    + '<div class="fg-in" style="--fg-at:2">' + loc(t, art) + '</div>'
  + '</div>'
  + '<div class="fg-wrap body">'
    + rail(t, art, {})
    + sheet(art, ''
      + bar(art, '') + fm(art)
      + '<div class="ann">'
        + bs.map(function (s, i) {
            var b = i ? ' brd' : '';
            var w = isWaitBand(i) ? ' band--wait' : '';
            var at = 4 + Math.min(i, 6);
            var on = i === tkb;
            return '<div class="acell asrc' + b + w + ' fg-in" style="--fg-at:' + at + '"><div class="src">' + s + '</div></div>'
              + '<div class="acell amar' + b + w + (on ? ' amar--on' : '') + ' fg-in" style="--fg-at:' + at + '">'
                + (on ? takeaway(d, '', at) : '')
              + '</div>';
          }).join('')
      + '</div>'
      + legend(t, d))
  + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════
   T7 · THE LEDGER
   ══════════════════════════════════════════════════════════════════════ */
function V7(t, art) {
  var d = t.docs[art];
  return ''
  + '<div class="fg-wrap body">'
    + '<div class="mast">'
      + mast(t)
      + '<div class="fg-in" style="--fg-at:2">' + loc(t, art) + '</div>'
      + rail(t, art, { numbered: true, mark: true })
    + '</div>'
    + sheet(art, bar(art, '') + fm(art) + srcGrid(d, art, 4) + legend(t, d)
        + takeaway(d, 'tk--foot', 11))
  + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════
   T8 · THE DOCK
   ══════════════════════════════════════════════════════════════════════ */
function V8(t, art) {
  var d = t.docs[art];
  return ''
  + '<div class="fg-wrap body">'
    + '<div class="mast">'
      + mast(t)
      + '<div class="fg-in" style="--fg-at:2">' + loc(t, art) + '</div>'
      + rail(t, art, { numbered: true, mark: true })
    + '</div>'
    + sheet(art, bar(art, '') + fm(art) + srcGrid(d, art, 4) + legend(t, d)
        + takeaway(d, 'tk--foot', 11))
  + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════
   T9 · THE STACK
   The locator moves into the sheet's bar here, beside the path: this is
   the treatment whose left column has a fourth job — the sentence — and
   a masthead of kicker, title, locator, list AND sentence is one band
   too many for a 250px column in German.
   ══════════════════════════════════════════════════════════════════════ */
function V9(t, art) {
  var d = t.docs[art];
  return ''
  + '<div class="fg-wrap body">'
    + '<div class="mast">'
      + mast(t)
      + rail(t, art, { numbered: true })
      + takeaway(d, 'tk--mar', 11)
    + '</div>'
    + sheet(art, bar(art, loc(t, art)) + fm(art) + srcGrid(d, art, 4) + legend(t, d))
  + '</div>';
}

var BODY = { v1: V1, v2: V2, v3: V3, v4: V4, v5: V5, v6: V6, v7: V7, v8: V8, v9: V9 };
/* 7, 8 and 9 share a base layer; 1–6 must not inherit it. */
var IX = { v7: 1, v8: 1, v9: 1 };

/* lang on the section, not just on <html>: it is what lets the browser
   hyphenate and quote German correctly, and this deck switches language
   inside one document. */
function render(v, lang, art) {
  var t = C[lang];
  return '<section class="proto ' + v + (IX[v] ? ' ix' : '') + ' ' + HUECLS[STEP[art]]
    + '" lang="' + lang + '">' + BODY[v](t, art) + '</section>';
}

var lang = 'en', proto = 'v1', art = 'spec';
var stage = document.getElementById('stage');

/* settle = render without the entrance choreography. A click on the rail
   is navigation, and navigation that re-runs a rise animation on eleven
   elements reads as a flicker rather than as a page turn. Replay and a
   language change still play it, because those are entrances. */
function mount(settle) {
  document.getElementById('subtitle').innerHTML = SUB[proto];
  stage.innerHTML = render(proto, lang, art);
  if (settle) stage.firstChild.classList.add('settled');
  var sync = function (sel, key, val) {
    var bs = document.querySelectorAll(sel + ' button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('active', bs[i].dataset[key] === String(val));
  };
  sync('#tabs', 'p', proto); sync('#langs', 'l', lang);
}

/* Choosing an artifact. Re-rendering the slide throws away the element
   that was focused, so focus is put back on the card that now reads as
   open — otherwise a keyboard user's next arrow press starts from the
   top of the document instead of from where they just were. */
function setArt(a, keepFocus) {
  art = a;
  mount(true);
  if (keepFocus) {
    var el = stage.querySelector('[data-art="' + a + '"]');
    if (el) el.focus();
  }
}

/* One delegated listener on the stage, so it survives every re-render
   and works for the rail in 2/4/5/6 and the crumb in 1/3 alike. */
stage.addEventListener('click', function (e) {
  var b = e.target.closest('[data-art]');
  if (b) setArt(b.dataset.art, false);
});
/* Arrow keys walk the set, Home and End jump to its ends. Both axes are
   accepted: the rail is vertical and the crumb is horizontal, and a
   viewer should not have to work out which one this treatment drew. */
stage.addEventListener('keydown', function (e) {
  var b = e.target.closest('[data-art]');
  if (!b) return;
  var i = ORDER.indexOf(b.dataset.art), n = ORDER.length, j = -1;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') j = (i + 1) % n;
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') j = (i + n - 1) % n;
  else if (e.key === 'Home') j = 0;
  else if (e.key === 'End') j = n - 1;
  if (j < 0) return;
  e.preventDefault();
  setArt(ORDER[j], true);
});

document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; proto = b.dataset.p; mount(); });
document.getElementById('langs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; mount(); });
document.getElementById('btn-replay').addEventListener('click', function () { mount(); });
document.getElementById('btn-grey').addEventListener('click', function () {
  document.body.classList.toggle('grey'); });
document.addEventListener('keydown', function (e) {
  if (e.target.closest('[data-art]')) return;
  if (['1', '2', '3', '4', '5', '6', '7', '8', '9'].indexOf(e.key) >= 0) { proto = 'v' + e.key; mount(); }
});

/* ══════════════════════════════════════════════════════════════════════
   MEASUREMENT

   Verified by eval, not by eyeballing. Two numbers and two probes:

   - fit: scrollHeight against clientHeight on the proto, plus the union
     of its bands as a percentage of the frame.
   - minType: the smallest font-size actually rendered on any element
     that carries its own text. The 14px floor is a promise about what
     the back row can read, and it is only checkable by asking the
     browser what it painted.
   - clip: THE ONE THE STANDARD CHECK MISSES. Every sheet here is
     overflow:hidden, and a box with overflow:hidden that is too small
     for its content reports the SAME scrollHeight as clientHeight on the
     proto above it — the content is simply gone. So every scroll
     container is asked directly, and every line of source is checked
     against the rect of the sheet that is supposed to contain it.
   ══════════════════════════════════════════════════════════════════════ */
window.fit = function () {
  var p = document.querySelector('#stage > .proto');
  var cs = getComputedStyle(p);
  var pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  var kids = p.querySelectorAll(':scope > *');
  var top = Infinity, bot = -Infinity;
  for (var i = 0; i < kids.length; i++) {
    var r = kids[i].getBoundingClientRect();
    if (r.height === 0) continue;
    top = Math.min(top, r.top); bot = Math.max(bot, r.bottom);
  }
  var pr = p.getBoundingClientRect();
  return {
    v: proto, lang: lang, art: art,
    scrollH: p.scrollHeight, clientH: p.clientHeight,
    over: p.scrollHeight - p.clientHeight,
    fill: +(((bot - top) / (pr.height - pad)) * 100).toFixed(1),
    minType: (function () {
      var all = p.querySelectorAll('*'), m = 999;
      for (var j = 0; j < all.length; j++) {
        if (!all[j].textContent.trim()) continue;
        if (all[j].children.length && all[j].textContent.trim() === all[j].children[0].textContent.trim()) continue;
        m = Math.min(m, parseFloat(getComputedStyle(all[j]).fontSize));
      }
      return +m.toFixed(1);
    })(),
    clip: window.clip(),
  };
};

window.clip = function () {
  var p = document.querySelector('#stage > .proto');
  var out = [];
  var all = p.querySelectorAll('*');
  for (var i = 0; i < all.length; i++) {
    var el = all[i], s = getComputedStyle(el);
    if (s.overflow === 'visible' && s.overflowY === 'visible' && s.overflowX === 'visible') continue;
    var dy = el.scrollHeight - el.clientHeight, dx = el.scrollWidth - el.clientWidth;
    if (dy > 1 || dx > 1) {
      out.push({ el: el.className.split(' ')[0] || el.tagName, dy: dy, dx: dx });
    }
  }
  /* Content that is inside the box's scroll extent but outside its
     painted rect — the failure a scrollHeight comparison cannot see. */
  var boxes = p.querySelectorAll('.sheet, .rail, .tkcell, .mast');
  for (var b = 0; b < boxes.length; b++) {
    var br = boxes[b].getBoundingClientRect();
    var lines = boxes[b].querySelectorAll('.ln, .tk, .q, .f, .fm span, .key span');
    for (var l = 0; l < lines.length; l++) {
      var lr = lines[l].getBoundingClientRect();
      if (lr.height === 0) continue;
      if (lr.bottom > br.bottom + 1 || lr.top < br.top - 1 || lr.right > br.right + 1) {
        out.push({ cut: (lines[l].textContent || '').slice(0, 42),
                   by: +(Math.max(lr.bottom - br.bottom, br.top - lr.top, lr.right - br.right)).toFixed(1) });
      }
    }
  }

  /* THE ONE THAT GOT THROUGH. A grid with stretched rows whose content
     needs more height than the grid has does not scroll and does not
     clip — it simply draws past its own bottom edge, INTO ITS SIBLING.
     Every line was still inside the sheet, so both checks above passed
     while the last line of verification.md was being sliced in half by
     the verdict legend. Siblings that overlap is the actual symptom, so
     that is what gets measured. */
  var stacks = p.querySelectorAll('.sheet, .proto > .body');
  for (var s2 = 0; s2 < stacks.length; s2++) {
    var kids2 = stacks[s2].querySelectorAll(':scope > *'), prev = null;
    for (var k = 0; k < kids2.length; k++) {
      var kr = kids2[k].getBoundingClientRect();
      if (kr.height === 0) continue;
      if (prev && kr.top < prev.r.bottom - 1 && kr.left < prev.r.right - 1) {
        out.push({ overlap: prev.c + '|' + (kids2[k].className.split(' ')[0] || '?'),
                   by: +(prev.r.bottom - kr.top).toFixed(1) });
      }
      prev = { r: kr, c: kids2[k].className.split(' ')[0] || '?' };
    }
  }

  /* And the band itself: a stretched grid reports its overflow here even
     though nothing clips it. */
  var grids = p.querySelectorAll('.ann, .src, .rail');
  for (var g = 0; g < grids.length; g++) {
    var gd = grids[g].scrollHeight - grids[g].clientHeight;
    if (gd > 1) out.push({ grid: grids[g].className.split(' ')[0], dy: gd });
  }

  /* OCCLUSION. Nothing above catches text that is present, in the right
     place, the right size — and painted over by an opaque sibling. It
     happened the moment the margin note came out of flow: the next
     margin cell drew across the bottom third of the sentence. So the
     page is asked what is actually on top at points inside each note. */
  var notes = p.querySelectorAll('.tk');
  for (var n = 0; n < notes.length; n++) {
    var nr = notes[n].getBoundingClientRect();
    if (nr.height === 0) continue;
    for (var f = 0.15; f < 1; f += 0.35) {
      var hit = document.elementFromPoint(nr.left + 6, nr.top + nr.height * f);
      if (hit && !notes[n].contains(hit) && !hit.contains(notes[n])) {
        out.push({ hidden: (notes[n].textContent || '').slice(0, 30),
                   under: hit.className.split(' ')[0] || hit.tagName });
        break;
      }
    }
  }
  return out;
};

/* ── THE JUMP PROBE ─────────────────────────────────────────────────────
   The defect that got treatment 5 rejected is a geometric one, so it is
   checkable rather than arguable. Render the slide four times, once per
   open artifact, and record where each card's file name and question
   sit relative to the rail's own top-left corner. A card's label appears
   in all four renders — open in one of them, closed in three — and if
   the four positions are not the same position, the label moves when the
   card opens. Returns the worst displacement in pixels, per version.

   Measured against the RAIL, not the viewport: a whole-rail shift would
   be a different bug, and this probe should not be able to hide one
   inside the other. */
window.jump = function (v, l) {
  var pos = {}, worst = 0, at = '';
  ORDER.forEach(function (open) {
    window.setState(v, l, open);
    var p = document.querySelector('#stage > .proto');
    var rr = p.querySelector('.rail').getBoundingClientRect();
    ORDER.forEach(function (a) {
      var card = p.querySelector('[data-art="' + a + '"]');
      ['.f', '.q'].forEach(function (sel) {
        var e = card.querySelector(sel); if (!e) return;
        var r = e.getBoundingClientRect();
        var k = a + sel, now = [r.left - rr.left, r.top - rr.top];
        if (pos[k]) {
          var d = Math.max(Math.abs(pos[k][0] - now[0]), Math.abs(pos[k][1] - now[1]));
          if (d > worst) { worst = d; at = k + ' when ' + open + ' is open'; }
        } else pos[k] = now;
      });
    });
  });
  return { v: v, lang: l, maxLabelShift: +worst.toFixed(2), where: at };
};

/* Measurement mounts SETTLED. The entrance is a translateY(12px), and
   Chrome counts a transformed descendant in a scroll container's
   overflow — so measuring mid-flight reports a 12px clip on every sheet
   in the file and buries the two real ones. The resting state is the
   state the slide is in for all but 1.2 seconds of its life, and it is
   the only one worth a number. */
window.setState = function (v, l, a) { proto = v; lang = l; art = a; mount(true); };

mount();
</script>
</body>
</html>
